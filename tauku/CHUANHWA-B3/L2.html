    <style>
        /* --- 動態背景動畫定義 --- */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 全局設定與柔和度調整 --- */
        body {
            font-family: 'tauhu-oo', sans-serif;
            margin: 0;
            padding: 0;
            /* 全頁繽紛漸層背景 + 動畫 */
            background: linear-gradient(-45deg, #fce4ec, #f8bbd0, #e1bee7, #c5cae9, #b3e5fc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            
            color: #333;
            display: flex;
            justify-content: center;
            min-height: 100vh; 
        }

        #app {
            width: 100%;
            max-width: 1000px;
            /* 1. 整體上移：移除上方 padding */
            padding: 0 20px 20px 20px; 
            box-sizing: border-box;
            position: relative;
        }

        /* 1. 整體上移：透過負 margin 讓內容更往上靠 */
        .page {
            margin-top: 20px; 
            transform: translateY(-20px); 
        }

        /* 螢幕適配 */
        @media (max-width: 600px) {
            #app { padding: 0 10px 10px 10px; }
            h1 { font-size: 1.6em; margin-top: 10px; }
            h2 { font-size: 1.1em; }
            #word-options { gap: 8px; }
            .word-option { padding: 8px 10px; font-size: 0.9em; }
            .chosen-word { font-size: 1.1em; }
            /* 針對小螢幕，資訊重新排列 */
            #answer-info .info-details-container { 
                flex-direction: row;
                flex-wrap: wrap;
                align-items: flex-start;
                gap: 3px;
            }
            
            /* 正確解答和正確選項組合：佔滿整行，標題和內容分行 */
            #answer-info .info-item.info-full {
                flex: 0 0 100%;
                width: 100%;
                text-align: center;
                margin-bottom: 5px;
            }
            
            #answer-info .info-item.info-full strong {
                display: block;
                margin-bottom: 3px;
                font-size: 0.9em;
            }
            
            #answer-info .info-item.info-full span {
                display: block;
                font-size: 0.95em;
                white-space: normal;
                word-wrap: break-word;
            }
            
            /* 項次、頁數、華語解釋：三欄並排，標題和內容分行 */
            #answer-info .info-item.info-third {
                flex: 0 0 calc(33.33% - 2px);
                text-align: center;
            }
            
            #answer-info .info-item.info-third strong {
                display: block;
                font-size: 0.85em;
                margin-bottom: 2px;
            }
            
            #answer-info .info-item.info-third span {
                display: block;
                font-size: 0.9em;
                white-space: normal;
                word-wrap: break-word;
            }
            #header-back-btn { font-size: 0.9em; padding: 5px 10px; }
            .control-panel button { padding: 8px 12px; font-size: 1em; }

            /* ↓↓↓ 6.2 吋手機專用重新配置 ↓↓↓ */

            body {
                justify-content: flex-start;  /* 讓內容從上方開始排，不居中 */
            }

            .page {
                margin-top: 5px;
                transform: none;              /* 手機版不再往下偏移，騰出下方空間 */
            }

            h1 {
                font-size: 1.4em;
                margin-bottom: 0.1em;
            }

            h2 {
                font-size: 1em;
                margin-bottom: 4px;
            }

            /* 遊戲主區塊改為依螢幕高度配置，去除固定長寬比避免中央擠在一起 */
            .game-area {
                aspect-ratio: auto;
                max-height: none;
                height: calc(100vh - 260px);  /* 預留給標題、警語與下方按鈕列 */
                margin-top: 0;
            }

            /* 三個區塊重新分配比例，避免互相壓縮重疊 */
            .result-area {
                flex: 1.1;
                padding: 2px 4px;
            }

            .options-area {
                flex: 2.1;
                padding: 2px 4px;
                align-items: flex-start;      /* 從上方開始排選項 */
                overflow-y: hidden;           /* 手機版不再出現捲動條 */
            }

            #answer-info {
                flex: 2.2;
                padding: 0 4px 4px 4px;
            }

            /* 手機版字體與內距微縮，讓 6~8 個選項完整顯示在畫面中 */
            .word-option,
            .chosen-word {
                padding: 4px 8px;
                font-size: 0.9em;
            }

            .info-content {
                padding: 4px 6px;
            }

            #result-feedback {
                font-size: 1.2em !important;
                margin-bottom: 4px !important;
            }

            .control-panel {
                padding: 6px 6px 8px 6px;
                margin-top: 0;
            }

            .control-panel button {
                padding: 6px 8px;
                font-size: 0.95em;
            }
        }

        /* 禁止選取文字與右鍵 */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* 主標題 - 漸層文字 */
        h1 { 
            text-align: center; margin-bottom: 0.1em;
            background: linear-gradient(to right, #8e24aa, #ec407a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            position: relative; 
        }
        
        /* 副標題 - 修正行距 */
        h2 { 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 5px; 
            line-height: 1.2; 
            background: linear-gradient(to right, #f4511e, #ff5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        /* header 區域設定 */
        header {
            position: relative;
            width: 100%;
            text-align: center;
        }

        /* 返回選單按鈕 */
        #header-back-btn {
            position: absolute;
            left: 0;
            top: 10px;
            padding: 5px 12px;
            background: linear-gradient(to bottom, #90caf9, #42a5f5);

            border: 2px solid rgba(255,255,255,0.6);

            font-size: 0.9em;
            font-weight: bold;

            z-index: 100;
        }
        #header-back-btn:hover {
            background: linear-gradient(to bottom, #42a5f5, #1e88e5);
        }

        /* 黃底紅字提示訊息 */
        .warning-msg {
            background-color: #fff59d; /* 柔和黃 */
            color: #d32f2f; /* 紅字 */
            padding: 8px 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1em;
            margin: 5px auto 10px auto;
            border: 2px solid #fbc02d;
            width: 95%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        /* 臨時的錯誤/確認訊息區塊 */
        #feedback-message {
            color: #d32f2f; 
            text-align: center;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 1.2em;
            height: 1.2em; 
        }

        /* --- 遊戲區塊與導角 (16:5) --- */
        .game-area {
            display: flex;
            flex-direction: column;
            width: 100%;
            aspect-ratio: 16 / 5; 
            max-height: calc(100vh - 200px); 
            border: none;
            border-radius: 20px 20px 0 0; /* 柔和導角 */
            box-shadow: 0 10px 25px rgba(100, 100, 255, 0.15);
            background-color: #ffffff;
            overflow: hidden;
            margin-top: 0px;
            position: relative;
        }

        /* 區域 1: 頂部作答區域 (橘/黃漸層) - 項目被選擇欄 */
        .result-area {
            flex: 1.5; /* 調整佔比 */
            background: linear-gradient(to bottom, #fff3e0, #ffe0b2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px; 
            z-index: 10;
            border-bottom: 1px solid rgba(255,255,255,0.5);
        }

        #chosen-words {
            width: 95%;
            border-bottom: 3px dashed #ff980080;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            min-height: 30px; 
            padding-bottom: 2px;
            gap: 5px;
        }

        /* 區域 2: 中間選項區域 (綠/藍漸層) - 項目待選擇欄 */
        .options-area {
            flex: 3.3; /* 調整佔比 */
            background: linear-gradient(to bottom, #e8f5e9, #c8e6c9);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px; 
            overflow-y: auto;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.5);
        }

        #word-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px; 
            justify-content: center;
            width: 95%;
            transition: opacity 0.3s;
        }
        
        /* 區域 3: 題目資訊 (Answer Info) - 獨立區塊 */
        #answer-info {
            position: relative; 
            width: 100%;
            flex: 7.5; /* 給予足夠空間顯示資訊 */
            padding: 2px;
            background: transparent; 
            box-sizing: border-box;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            pointer-events: auto;
        }

        /* --- 語詞按鈕樣式 (糖果質感) --- */
        .word-option, .chosen-word {
            padding: 6px 12px; 
            border-radius: 30px; 
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            font-size: 1em; 
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        /* 一般選項 (綠色系) */
        .word-option {
            background: linear-gradient(145deg, #a5d6a7, #81c784);
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
            color: #1b5e20; 
        }

        .option-number {
            font-size: 0.8em;
            opacity: 0.8;
            margin-bottom: -3px;
        }
        .word-option .option-number { color: #1b5e20; }

        .word-option:hover { 
            background: linear-gradient(145deg, #81c784, #66bb6a);
            transform: translateY(-2px);
        }
        .word-option:active { 
            box-shadow: 0 2px 5px rgba(76, 175, 80, 0.3); 
            transform: translateY(1px); 
        }

        /* 被選取的語詞樣式 (橘色系) */
        .chosen-word {
            background: linear-gradient(145deg, #ffb74d, #ff9800);
            box-shadow: 0 4px 10px rgba(239, 108, 0, 0.3);
            color: #fff;
            font-size: 1.2em;
            margin: 2px;
            padding: 6px 12px;
        }
        
        .chosen-word .option-number { color: #fff; }
        
        .chosen-word:hover { 
            background: linear-gradient(145deg, #ff9800, #f57c00);
            transform: translateY(-2px);
        }
        .chosen-word:active { 
             box-shadow: 0 2px 5px rgba(239, 108, 0, 0.3);
             transform: translateY(1px); 
        }

        .hidden { display: none !important; }

        /* --- 控制面板 --- */
        .control-panel {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: linear-gradient(to top, #e3f2fd, #bbdefb);
            border: none;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            box-sizing: border-box;
            max-width: 1000px;
            margin-top: -3px;
            position: relative;
        }

        .control-panel button {
            padding: 10px 20px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 12px; 
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            color: white;
        }
        .control-panel button:active { transform: translateY(2px); }
        
        /* 禁用狀態樣式 */
        .control-panel button:disabled {
            background: #e0e0e0 !important;
            color: #9e9e9e !important;
            box-shadow: none !important;
            cursor: not-allowed;
            border: 2px solid #bdbdbd;
        }

        /* 上一題按鈕 (紫色漸層) */
        #prev-button {
            background: linear-gradient(to bottom, #ab47bc, #8e24aa);
            box-shadow: 0 4px 10px rgba(142, 36, 170, 0.4);
        }
        #prev-button:active { box-shadow: 0 2px 5px rgba(142, 36, 170, 0.4); }

        #submit-button { 
            background: linear-gradient(to bottom, #ff8a65, #ff5722);
            box-shadow: 0 4px 10px rgba(230, 81, 0, 0.4);
        }
        #submit-button:active { box-shadow: 0 2px 5px rgba(230, 81, 0, 0.4); }

        #undo-button { 
            background: linear-gradient(to bottom, #bdbdbd, #9e9e9e);
            box-shadow: 0 4px 10px rgba(158, 158, 158, 0.4);
        }
        #undo-button:active { box-shadow: 0 2px 5px rgba(158, 158, 158, 0.4); }

        #next-button { 
            background: linear-gradient(to bottom, #81c784, #43a047);
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.4);
        }
        #next-button:active { box-shadow: 0 2px 5px rgba(46, 125, 50, 0.4); }

        /* 加寬資訊方框 */
        .info-content {
            width: 99%; 
            max-width: 99%; 
            overflow: hidden; 
            max-height: 100%; 
            padding: 0 10px; /* 移除上下白邊 */
            background: rgba(255, 255, 255, 0.6); /* 稍微透明一點 */
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 凸顯回饋訊息 */
        #result-feedback {
            font-size: 1.4em !important; 
            font-weight: 900 !important; 
            margin-bottom: 5px !important;
            margin-top: 0 !important;
            padding: 2px 15px;
            border-radius: 10px;
            animation: pulse 0.8s infinite alternate; 
            display: block; 
            background-image: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2));
            border: 1px solid rgba(0,0,0,0.05);
        }
        
        @keyframes pulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.9; transform: scale(1.02); }
        }

        /* 資訊由左至右配置容器 */
        .info-details-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start; 
            width: 100%;
            gap: 5px; 
            padding: 0;
        }

        /* 欄位通用樣式 */
        .info-details-container .info-item {
            text-align: center; 
            margin: 0;
            padding: 0;
            min-width: 40px; 
            display: flex;
            flex-direction: column; 
            align-items: center;
            line-height: 1.2; 
        }

        /* --- 調整欄寬分配 --- */
        .info-details-container .info-item:nth-child(1) { flex: 4; } /* Correct Sentence */
        .info-details-container .info-item:nth-child(2) { flex: 2; } /* Correct Combo */
        .info-details-container .info-item:nth-child(3) { flex: 0.6; } /* Index */
        .info-details-container .info-item:nth-child(4) { flex: 0.6; } /* Page */
        .info-details-container .info-item:nth-child(5) { flex: 3; } /* Chinese */


        /* 標題樣式 */
        .info-details-container .info-item strong {
            font-size: 1em; 
            margin-bottom: 2px; 
            display: block;
            color: #5e35b1; 
        }
        
        /* 內容樣式 (單行不跳行) */
        .info-details-container .info-item span {
            font-size: 0.95em; 
            font-weight: normal; 
            display: block; 
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis; 
            width: 100%; 
        }
        
        /* 針對華語解釋欄位給予更明顯的顏色 */
        .info-details-container .info-item:nth-child(5) span {
            color: #0277bd; 
            font-weight: bold;
        }

        /* --- 選單樣式 --- */
        .menu-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .menu-container button {
            padding: 10px 15px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 10px; /* 導角 */
            background: linear-gradient(to bottom, #e3f2fd, #bbdefb);
            color: #1565c0; 
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
            box-shadow: 0 3px 6px rgba(33, 150, 243, 0.2);
            font-weight: bold;
        }
        .menu-container button.selected {
            background: linear-gradient(to bottom, #42a5f5, #1e88e5);
            color: white;
            box-shadow: 0 3px 8px rgba(13, 71, 161, 0.4);
        }
        .menu-container button:active { transform: translateY(2px); }

        #start-game {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            font-size: 1.2em;
            background: linear-gradient(to bottom, #a5d6a7, #81c784);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 15px; 
            opacity: 0.6;
            box-shadow: 0 4px 10px rgba(56, 142, 60, 0.3);
            font-weight: bold;
            transition: all 0.2s;
        }
        #start-game:enabled {
            opacity: 1;
            background: linear-gradient(to bottom, #66bb6a, #43a047);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.5);
        }
        #start-game:enabled:active { 
            transform: translateY(2px); 
            box-shadow: 0 2px 6px rgba(46, 125, 50, 0.5);

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

                gainNode.gain.setValueAtTime(0.3, now);

                oscillator.stop(now + 0.5);

                oscillator.start(now);

            { index: 75, page: 31, taigi: "四序", tailo: "sù-sī", chinese: "井井有條、妥當/讓人覺得舒服安適的感覺", example: "阿娟的別莊整理甲嶄然四序", parts: ["阿娟的", "別莊", "整理甲", "嶄然四序"] },
            { index: 76, page: 31, taigi: "呵咾", tailo: "o-ló", chinese: "讚美、表揚", example: "食過的人攏呵咾甲會觸舌", parts: ["食過的人", "攏", "呵咾", "甲會觸舌"] }
        ];
        
        // 確保所有題目都有四個語詞，不足的用空字串佔位，以便隨機選項填充
        FULL_GAME_DATA.forEach(item => {
            while (item.parts.length < 4) {
                item.parts.push("");
            }
        });

        let currentMode = '';
        let currentCount = 0; 
        let currentQuestionList = []; 
        let currentQuestionIndex = 0; 
        let currentQuestion = null;
        let chosenWords = [];
        let availableWords = [];

        // 輔助函數：Fisher-Yates 洗牌算法
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initializeGameQuestions(count) {
            let shuffledData = shuffleArray([...FULL_GAME_DATA]);
            currentQuestionList = shuffledData.slice(0, count);
            currentQuestionIndex = 0;
            loadCurrentQuestion(currentMode);
        }

        function prepareQuestion(questionData, mode) {
            const isTaigi = mode === 'taigi';
            const correctParts = questionData.parts.filter(p => p !== "");
            
            const sequenceWords = correctParts.map(p => {
                // 如果是台語模式，直接回傳漢字
                if (isTaigi) return p;

                // 如果是台羅模式：
                // 1. 先檢查該片段是否包含「當前題目的台語關鍵詞」
                if (p.includes(questionData.taigi)) {
                    return p.split(questionData.taigi).join(questionData.tailo);
                }

                // 2. 若沒有包含當前關鍵詞，則檢查是否完全匹配資料庫中的其他詞彙
                const dbEntry = FULL_GAME_DATA.find(d => d.taigi === p);
                return dbEntry ? dbEntry.tailo : p;
            });
            
            const irrelevantCandidates = FULL_GAME_DATA.filter(d => d.index !== questionData.index);
            const shuffledIrrelevant = shuffleArray(irrelevantCandidates).slice(0, 2);
            
            const irrelevantOptions = shuffledIrrelevant.map(d => isTaigi ? d.taigi : d.tailo);

            let allOptions = [...sequenceWords, ...irrelevantOptions];
            
            let shuffledOptions = shuffleArray(allOptions.map(word => ({
                word: word,
                isCorrectPart: sequenceWords.includes(word) 
            })));

            shuffledOptions.forEach((item, i) => item.optionNumber = i + 1);

            currentQuestion = {
                ...questionData,
                correct_sequence: sequenceWords,
                availableWords: shuffledOptions,
            };
            
            renderGamePage();
        }

        // 載入當前題目
        function loadCurrentQuestion(mode) {
            if (currentQuestionIndex < currentQuestionList.length) {
                const questionData = currentQuestionList[currentQuestionIndex];
                prepareQuestion(questionData, mode);
                document.getElementById('current-progress').textContent = `第 ${currentQuestionIndex + 1} 題 / 共 ${currentCount} 題`;
                
                // 更新上一題按鈕狀態
                document.getElementById('prev-button').disabled = (currentQuestionIndex === 0);
                
            } else {
                const headerBackBtn=document.getElementById('header-back-btn'); if(headerBackBtn){ headerBackBtn.click(); return; }
                const backBtn=document.getElementById('back-to-menu'); if(backBtn){ backBtn.click(); } 
            }
        }


        // --- 渲染與互動邏輯 ---

        function renderOptions() {
            const optionsDiv = document.getElementById('word-options');
            optionsDiv.innerHTML = '';
            
            // 始終渲染所有未被選中的選項，確保綠色選項不消失
            currentQuestion.availableWords.forEach((item) => {
                if (!chosenWords.some(cw => cw.optionNumber === item.optionNumber)) {
                    const button = document.createElement('button');
                    button.className = 'word-option';
                    button.innerHTML = `
                        <div class="option-number">${item.optionNumber}</div>
                        <div class="option-word">${item.word}</div>
                    `;
                    button.dataset.optionNumber = item.optionNumber;
                    button.onclick = () => selectWord(item);
                    optionsDiv.appendChild(button);
                }
            });
        }

        function renderChosenWords() {
            const chosenDiv = document.getElementById('chosen-words');
            chosenDiv.innerHTML = '';

            chosenWords.forEach((item) => {
                const button = document.createElement('button');
                button.className = 'chosen-word';
                 button.innerHTML = `
                    <div class="option-number">${item.optionNumber}</div>
                    <div class="option-word">${item.word}</div>
                `;
                button.dataset.optionNumber = item.optionNumber;
                button.onclick = () => deselectWord(item);
                chosenDiv.appendChild(button);
            });

            document.getElementById('undo-button').disabled = chosenWords.length === 0;
        }

        function selectWord(item) {
            chosenWords.push(item);
            renderChosenWords();
            renderOptions();
        }

        function deselectWord(itemToRemove) {
            chosenWords = chosenWords.filter(item => item.optionNumber !== itemToRemove.optionNumber);
            renderChosenWords();
            renderOptions(); 
        }

        function renderGamePage() {
            chosenWords = [];
            document.getElementById('submit-button').textContent = "公布答案";
            document.getElementById('submit-button').disabled = false;
            document.getElementById('next-button').classList.add('hidden');
            
            document.getElementById('answer-info').classList.add('hidden');
            document.getElementById('word-options').style.opacity = '1';
            
            // 清除臨時訊息
            document.getElementById('feedback-message').classList.add('hidden'); 
            document.getElementById('result-feedback').textContent = '';

            renderOptions();
            renderChosenWords();
        }

        function submitAnswer() {
            const feedbackMessageAbove = document.getElementById('feedback-message');
            feedbackMessageAbove.classList.add('hidden'); 

            const correctSequence = currentQuestion.correct_sequence;
            const userSequence = chosenWords.map(item => item.word);
            const feedbackElement = document.getElementById('result-feedback');

            const isCorrect = userSequence.length === correctSequence.length && 
                              userSequence.every((word, index) => word === correctSequence[index]);

            let resultText;
            let resultStyle;

            if (isCorrect) {
                playAudio('correct');
                resultText = "正確！你著矣，共你拍噗仔！";
                resultStyle = "color: #1b5e20; background-color: #c8e6c9; border-color: #81c784;"; 
            } else {
                playAudio('wrong');
                resultText = "毋著！請斟酌看解說！"; 
                resultStyle = "color: #b71c1c; background-color: #ffcdd2; border-color: #e57373;";
            }

            feedbackElement.textContent = resultText;
            feedbackElement.style = resultStyle; 

            document.getElementById('submit-button').disabled = true;

            const correctCombo = correctSequence.map(word => {
                const item = currentQuestion.availableWords.find(a => a.word === word && a.isCorrectPart);
                return item ? item.optionNumber : 'X';
            });

            document.getElementById('correct-sentence').textContent = correctSequence.join(' ');
            document.getElementById('correct-combo').textContent = correctCombo.join(', ');
            
            const detail = FULL_GAME_DATA.find(d => d.index === currentQuestion.index);
            
            document.getElementById('question-index').textContent = detail.index;
            document.getElementById('question-page').textContent = detail.page;
            document.getElementById('question-chinese').textContent = detail.chinese;

            // 移除隱藏選項的邏輯，讓綠色選項保留
            // document.getElementById('word-options').style.opacity = '0'; 
            
            document.getElementById('answer-info').classList.remove('hidden');
            document.getElementById('next-button').classList.remove('hidden');
        }

        // 初始化遊戲
        document.addEventListener('DOMContentLoaded', () => {
            const menuPage = document.getElementById('menu-page');
            const gamePage = document.getElementById('game-page');
            const modeSelection = document.getElementById('mode-selection');
            const countSelection = document.getElementById('count-selection');
            const startGameButton = document.getElementById('start-game');
            const submitButton = document.getElementById('submit-button');
            const undoButton = document.getElementById('undo-button');
            const backToMenuButton = document.getElementById('back-to-menu');
            const nextButton = document.getElementById('next-button');
            const prevButton = document.getElementById('prev-button'); 
            
            const headerBackBtn = document.getElementById('header-back-btn');
            headerBackBtn.addEventListener('click', () => {
                gamePage.classList.add('hidden');
                menuPage.classList.remove('hidden');
                currentMode = '';
                currentCount = 0;
                currentQuestionList = [];
                modeSelection.querySelectorAll('button').forEach(btn => btn.classList.remove('selected'));
                countSelection.querySelectorAll('button').forEach(btn => btn.classList.remove('selected'));
                updateStartButton();
            });

            document.addEventListener('contextmenu', event => event.preventDefault());
            
            function updateStartButton() {
                startGameButton.disabled = !(currentMode && currentCount > 0);
                startGameButton.textContent = startGameButton.disabled ? "請選擇遊戲方式和數量" : `開始 ${currentCount} 題測驗`;
                if (startGameButton.disabled) {
                     startGameButton.style.background = "linear-gradient(to bottom, #a5d6a7, #81c784)";
                     startGameButton.style.boxShadow = "0 4px 10px rgba(56, 142, 60, 0.3)";
                } else {
                     startGameButton.style.background = "linear-gradient(to bottom, #66bb6a, #43a047)";
                     startGameButton.style.boxShadow = "0 4px 12px rgba(46, 125, 50, 0.5)";
                }
            }

            modeSelection.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') {
                    currentMode = e.target.dataset.mode;
                    modeSelection.querySelectorAll('button').forEach(btn => btn.classList.remove('selected'));
                    e.target.classList.add('selected');
                    updateStartButton();
                }
            });

            countSelection.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') {
                    currentCount = parseInt(e.target.dataset.count);
                    countSelection.querySelectorAll('button').forEach(btn => btn.classList.remove('selected'));
                    e.target.classList.add('selected');
                    updateStartButton();
                }
            });

            startGameButton.addEventListener('click', () => {
                if (currentMode && currentCount) {
                    menuPage.classList.add('hidden');
                    gamePage.classList.remove('hidden');
                    initializeGameQuestions(currentCount);
                }
            });

            submitButton.addEventListener('click', submitAnswer);
            undoButton.addEventListener('click', () => {
                document.getElementById('feedback-message').classList.add('hidden'); 
                chosenWords.forEach(item => deselectWord(item));
            });

            if(backToMenuButton) backToMenuButton.addEventListener('click', () => {
                gamePage.classList.add('hidden');
                menuPage.classList.remove('hidden');
                currentMode = '';
                currentCount = 0;
                currentQuestionList = [];
                modeSelection.querySelectorAll('button').forEach(btn => btn.classList.remove('selected'));
                countSelection.querySelectorAll('button').forEach(btn => btn.classList.remove('selected'));
                updateStartButton();
            });

            nextButton.addEventListener('click', () => {
                currentQuestionIndex++;
                loadCurrentQuestion(currentMode);
            });

            prevButton.addEventListener('click', () => {
                if (currentQuestionIndex > 0) {
                    currentQuestionIndex--;
                    loadCurrentQuestion(currentMode);
                }
            });

            updateStartButton();
        });
    </script>
