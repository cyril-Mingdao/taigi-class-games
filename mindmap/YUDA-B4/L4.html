            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.6);
            } catch (e) {
                // 音效播放失敗時的靜默處理

        function playIncorrectSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();

                oscillator.connect(gainNode);

                oscillator.frequency.setValueAtTime(220, audioContext.currentTime); // A3

                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                
                oscillator.start(audioContext.currentTime);

        // 智能題目選擇函數 - 避免3輪內重複
        function selectQuestionsWithoutRepeat(questionCount) {
            // 取得可用的題目（排除最近3輪使用過的）
            const availableQuestions = questionBank.filter(q => 
                !questionHistory.usedQuestions.includes(q.id)
            );
            
            let selectedQuestions = [];
            
            // 如果可用題目足夠，直接從中選擇
            if (availableQuestions.length >= questionCount) {
                // 洗牌可用題目
                const shuffled = [...availableQuestions];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                selectedQuestions = shuffled.slice(0, questionCount);
            } else {
                // 如果可用題目不足，先用完所有可用的，再從全部題目中補足
                selectedQuestions = [...availableQuestions];
                
                // 計算還需要多少題目
                const remainingCount = questionCount - availableQuestions.length;
                
                // 從全部題目中隨機選擇剩餘的題目
                const allShuffled = [...questionBank];
                for (let i = allShuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [allShuffled[i], allShuffled[j]] = [allShuffled[j], allShuffled[i]];
                }
                
                // 補足剩餘題目（避免重複選到已選的）
                for (let question of allShuffled) {
                    if (remainingCount > 0 && !selectedQuestions.find(q => q.id === question.id)) {
                        selectedQuestions.push(question);
                        if (selectedQuestions.length >= questionCount) break;
                    }
                }
                
                // 最終洗牌
                for (let i = selectedQuestions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [selectedQuestions[i], selectedQuestions[j]] = [selectedQuestions[j], selectedQuestions[i]];
                }
            }
            
            return selectedQuestions;
        }

        // 更新題目歷史記錄
        function updateQuestionHistory(selectedQuestions) {
            const selectedIds = selectedQuestions.map(q => q.id);
            
            // 將本輪使用的題目ID加入歷史記錄
            questionHistory.usedQuestions.push(...selectedIds);
            
            // 保持歷史記錄在限制範圍內（最多3輪）
            const maxTotalQuestions = questionHistory.maxHistorySize * Math.max(5, 7, 9, 11, 13);
            if (questionHistory.usedQuestions.length > maxTotalQuestions) {
                questionHistory.usedQuestions = questionHistory.usedQuestions.slice(-maxTotalQuestions);
            }
        }

        function startGame(questionCount) {
            // 使用智能選題系統
            const selectedQuestions = selectQuestionsWithoutRepeat(questionCount);
            
            // 為每題重新洗牌選項
            currentGame.questions = selectedQuestions.map(question => {
                const shuffledOptions = [...question.options];
                for (let i = shuffledOptions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
                }
                return {
                    ...question,
                    options: shuffledOptions
                };
            });
            
            // 更新題目歷史記錄
            updateQuestionHistory(selectedQuestions);
            
            currentGame.totalQuestions = questionCount;
            currentGame.currentQuestion = 0;
            currentGame.selectedAnswer = null;

            // 隱藏選擇器，顯示遊戲區域
            document.getElementById('questionSelector').style.display = 'none';
            document.getElementById('gameArea').classList.add('active');

            // 開始第一題
            showQuestion();
        }

        function showQuestion() {
            const question = currentGame.questions[currentGame.currentQuestion];
            
            // 更新進度
            document.getElementById('questionCounter').textContent = 
                `${currentGame.currentQuestion + 1}/${currentGame.totalQuestions}`;

            // 顯示句子和頁碼
            document.getElementById('sentenceText').textContent = question.sentence;
            document.getElementById('pageSource').textContent = `來源：${question.page}`;

            // 顯示選項
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.onclick = () => selectOption(optionDiv, option, question.correct);
                
                optionDiv.innerHTML = `
                    <div class="option-number">${String.fromCharCode(65 + index)}</div>
                    <div class="option-text">${option}</div>
                `;
                
                optionsContainer.appendChild(optionDiv);
            });

            currentGame.selectedAnswer = null;
            
            // 更新導航按鈕狀態
            updateNavigationButtons();
        }

        function selectOption(optionElement, selectedAnswer, correctAnswer) {
            // 如果已經選擇過，不允許重複選擇
            if (currentGame.selectedAnswer !== null) return;

            currentGame.selectedAnswer = selectedAnswer;

            // 清除所有選項的選中狀態
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });

            // 立即標記選中的選項
            optionElement.classList.add('selected');

            // 立即檢查答案並播放音效
            if (selectedAnswer === correctAnswer) {
                optionElement.classList.add('correct');
                playCorrectSound();
            } else {
                optionElement.classList.add('incorrect');
                playIncorrectSound();
                
                // 錯誤答案，1秒後重置選擇狀態，允許重新選擇
                setTimeout(() => {
                    optionElement.classList.remove('selected', 'incorrect');
                    currentGame.selectedAnswer = null;
                }, 1000);
            }
        }

        function nextQuestion() {
            // 檢查是否已經是最後一題
            if (currentGame.currentQuestion >= currentGame.totalQuestions - 1) {
                // 已經是最後一題，不做任何操作
                return;
            }
            
            currentGame.currentQuestion++;
            showQuestion();
        }

        function previousQuestion() {
            // 檢查是否已經是第一題
            if (currentGame.currentQuestion <= 0) {
                // 已經是第一題，不做任何操作
                return;
            }
            
            currentGame.currentQuestion--;
            showQuestion();
        }

        function updateNavigationButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            // 如果是第一題，禁用上一題按鈕
            if (currentGame.currentQuestion === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }
            
            // 如果是最後一題，禁用下一題按鈕
            if (currentGame.currentQuestion >= currentGame.totalQuestions - 1) {
                nextBtn.disabled = true;
            } else {
                nextBtn.disabled = false;
            }
        }

        function showCompletion() {
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('completionScreen').classList.add('active');
        }

        function backToMenu() {
            document.getElementById('completionScreen').classList.remove('active');
            document.getElementById('questionSelector').style.display = 'flex';
            
            // 重置遊戲狀態
            currentGame = {
                questions: [],
                currentQuestion: 0,
                totalQuestions: 0,
                selectedAnswer: null
            };
        }

        function returnToMenu() {
            // 隱藏遊戲區域
            document.getElementById('gameArea').classList.remove('active');
            // 顯示選題選單
            document.getElementById('questionSelector').style.display = 'flex';
            
            // 重置遊戲狀態
            currentGame = {
                questions: [],
                currentQuestion: 0,
                totalQuestions: 0,
                selectedAnswer: null
            };
        }

        // Element SDK 初始化
        async function onConfigChange(config) {
            const title = config.game_title || defaultConfig.game_title;
            document.getElementById('gameTitle').textContent = title;
        }

        if (window.elementSdk) {
            window.elementSdk.init({

                }),
                mapToEditPanelValues: (config) => new Map([
                    ["game_title", config.game_title || defaultConfig.game_title]
                ])
            });
        }

        // 初始化

<script id="md-mmzoom-js">
(function(){
 var d=document,ov=d.getElementById('md-mmzoom'),big=ov.querySelector('img'),src=d.querySelector('#questionSelector img');
 if(!src)return;
 var weFs=false;
 function fsEl(){return d.fullscreenElement||d.webkitFullscreenElement||null;}
 function open(){
  big.src=src.src;ov.hidden=false;weFs=false;entered=false;
  var r=ov.requestFullscreen||ov.webkitRequestFullscreen;
  if(r){try{var p=r.call(ov);weFs=true;if(p&&p.catch)p.catch(function(){weFs=false;});}catch(_){weFs=false;}}
 }
 function close(){
  if(ov.hidden)return;
  ov.hidden=true;
  if(weFs&&fsEl()===ov){var x=d.exitFullscreen||d.webkitExitFullscreen;if(x){try{var p=x.call(d);if(p&&p.catch)p.catch(function(){});}catch(_){}}}
  weFs=false;
 }
 src.addEventListener('click',open);
 ov.addEventListener('click',close);
 d.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
 var entered=false;
 function onFs(){
  if(fsEl()===ov){entered=true;return;}
  if(!ov.hidden&&entered){entered=false;weFs=false;ov.hidden=true;}
 }

})();

<style id="md-mmbig-css">

<script id="md-mmbig-js">
(function(){
 var raf=0;
 function land(){return innerWidth>innerHeight;}
 function fitOptions(){
  var opts=[].slice.call(document.querySelectorAll('#optionsContainer .option'));
  if(!opts.length)return;
  var texts=opts.map(function(o){return o.querySelector('.option-text');});
  var nums=opts.map(function(o){return o.querySelector('.option-number');});
  if(!land()){texts.concat(nums).forEach(function(e){if(e)e.removeAttribute('style');});return;}
  var h=Math.min.apply(null,opts.map(function(o){return o.clientHeight;}));
  if(!h)return;
  function apply(s){
   texts.forEach(function(t){t.style.fontSize=s+'px';});
   nums.forEach(function(n){var d=Math.round(s*1.25);n.style.width=n.style.height=d+'px';n.style.fontSize=Math.round(s*0.75)+'px';n.style.marginRight=Math.round(s*0.45)+'px';});
  }
  function ok(){
   for(var i=0;i<opts.length;i++){
    var o=opts[i],t=texts[i],cs=getComputedStyle(o);
    var ih=o.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    if(t.scrollHeight>ih+1||t.scrollWidth>t.clientWidth+1||nums[i].offsetHeight>ih+1)return false;
   }
   return true;
  }
  var lo=14,hi=Math.max(14,Math.floor(h*0.62));
  apply(lo);
  while(lo<hi){var mid=Math.ceil((lo+hi)/2);apply(mid);if(ok())lo=mid;else hi=mid-1;}
  apply(lo);
 }
 function fitSentence(){
  var t=document.getElementById('sentenceText'),box=t&&t.closest('.sentence-container'),panel=t&&t.closest('.right-panel');
  if(!t||!panel)return;
  t.style.fontSize='';
  if(!land()||!t.textContent)return;
  var base=parseFloat(getComputedStyle(t).fontSize);
  var cs=getComputedStyle(panel);
  var avail=panel.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-8;
  var cap=Math.max(base,Math.floor(innerHeight*0.075));
  function ok(){return box.offsetHeight<=avail&&t.scrollWidth<=t.clientWidth+1;}
  var lo=Math.floor(base),hi=cap;
  while(lo<hi){var mid=Math.ceil((lo+hi)/2);t.style.fontSize=mid+'px';if(ok())lo=mid;else hi=mid-1;}
  t.style.fontSize=lo+'px';
 }
 function fit(){
  var g=document.getElementById('gameArea');
  if(!g||!g.classList.contains('active'))return;
  fitOptions();fitSentence();
 }
 function later(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fit);}
 if(typeof showQuestion==='function'){
  var orig=showQuestion;
  showQuestion=function(){var r=orig.apply(this,arguments);fit();return r;};
 }

 if(window.ResizeObserver){
  var ro=new ResizeObserver(later);

  var rp=document.querySelector('.right-panel');if(rp)ro.observe(rp);
 }
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(later);
})();
</script>

<script id="md-mmpdf-js">
(function(){
 var PDF='pdf/L4.pdf',NAME='詹宗龍-育達長鴻第2冊-04講義-未食五日節粽心智圖A3';
 var d=document,img=d.querySelector('#questionSelector img');if(!img)return;
 var box=img.parentElement;box.style.position='relative';
 var b=d.createElement('button');b.type='button';b.id='md-pdf-btn';
 b.title='下載 A3 講義 PDF：'+NAME;b.setAttribute('aria-label','下載 A3 講義 PDF');
 b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 17v3h16v-3"/></svg>';
 box.appendChild(b);
 var tip=d.createElement('div');tip.id='md-pdf-tip';tip.hidden=true;d.body.appendChild(tip);
 function say(t){tip.textContent=t;tip.hidden=false;clearTimeout(say.t);say.t=setTimeout(function(){tip.hidden=true;},2500);}
 function place(){
  var r=img.offsetLeft+img.offsetWidth,gap=16,w=56;
  if(r+gap+w<=box.clientWidth){b.classList.remove('inside');b.style.left=(r+gap)+'px';b.style.top=img.offsetTop+'px';}
  else{b.classList.add('inside');b.style.left=(r-44-6)+'px';b.style.top=(img.offsetTop+6)+'px';}
 }
 place();window.addEventListener('resize',place);
 if(window.ResizeObserver)new ResizeObserver(place).observe(img);

 b.addEventListener('click',function(e){
  e.stopPropagation();
  if(b.classList.contains('busy'))return;
  if(!window.showSaveFilePicker){plain();return;}
  var h;
  window.showSaveFilePicker({suggestedName:NAME+'.pdf',startIn:'desktop',types:[{description:'PDF 講義',accept:{'application/pdf':['.pdf']}}]})
  .then(function(x){h=x;b.classList.add('busy');return fetch(PDF);})
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.blob();})
  .then(function(blob){return h.createWritable().then(function(w){return w.write(blob).then(function(){return w.close();});});})
  .then(function(){b.classList.remove('busy');say('已存檔：'+h.name);})
  .catch(function(err){b.classList.remove('busy');if(err&&err.name==='AbortError')return;plain();});
 });
})();
</script>
