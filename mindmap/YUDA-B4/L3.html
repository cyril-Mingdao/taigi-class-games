        .option.selected {

            border-color: #4a90e2;
        }

        .option.correct {
            background: linear-gradient(145deg, #d4edda, #c3e6cb);
            border-color: #28a745;
            animation: correctPulse 0.8s ease;
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.4);

        .option.correct::after {
            content: '✓';
            position: absolute;
            right: 20px;
            font-size: 28px;
            color: #28a745;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .option.incorrect {
            background: linear-gradient(145deg, #f8d7da, #f5c6cb);
            border-color: #dc3545;
            animation: incorrectShake 0.6s ease;
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.4);
        }

        .option.incorrect::after {
            content: '✗';
            position: absolute;
            right: 20px;
            font-size: 28px;
            color: #dc3545;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes incorrectShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

            let selectedQuestions = [];
            
            // 如果可用題目足夠，直接從中選擇
            if (availableQuestions.length >= questionCount) {
                // 洗牌可用題目
                const shuffled = [...availableQuestions];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                selectedQuestions = shuffled.slice(0, questionCount);
            } else {
                // 如果可用題目不足，先用完所有可用的，再從全部題目中補足
                selectedQuestions = [...availableQuestions];
                
                // 計算還需要多少題目
                const remainingCount = questionCount - availableQuestions.length;
                
                // 從全部題目中隨機選擇剩餘的題目
                const allShuffled = [...questionBank];
                for (let i = allShuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [allShuffled[i], allShuffled[j]] = [allShuffled[j], allShuffled[i]];
                }
                
                // 補足剩餘題目（避免重複選到已選的）
                for (let question of allShuffled) {
                    if (remainingCount > 0 && !selectedQuestions.find(q => q.id === question.id)) {
                        selectedQuestions.push(question);
                        if (selectedQuestions.length >= questionCount) break;
                    }
                }
                
                // 最終洗牌
                for (let i = selectedQuestions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [selectedQuestions[i], selectedQuestions[j]] = [selectedQuestions[j], selectedQuestions[i]];
                }
            }
            
            return selectedQuestions;
        }

        // 更新題目歷史記錄
        function updateQuestionHistory(selectedQuestions) {
            const selectedIds = selectedQuestions.map(q => q.id);
            
            // 將本輪使用的題目ID加入歷史記錄
            questionHistory.usedQuestions.push(...selectedIds);
            
            // 保持歷史記錄在限制範圍內（最多3輪）
            const maxTotalQuestions = questionHistory.maxHistorySize * Math.max(5, 7, 9, 11, 13);
            if (questionHistory.usedQuestions.length > maxTotalQuestions) {
                questionHistory.usedQuestions = questionHistory.usedQuestions.slice(-maxTotalQuestions);
            }
        }

        function startGame(questionCount) {
            // 使用智能選題系統
            const selectedQuestions = selectQuestionsWithoutRepeat(questionCount);
            
            // 為每題重新洗牌選項
            currentGame.questions = selectedQuestions.map(question => {
                const shuffledOptions = [...question.options];
                for (let i = shuffledOptions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
                }
                return {
                    ...question,
                    options: shuffledOptions
                };
            });
            
            // 更新題目歷史記錄
            updateQuestionHistory(selectedQuestions);
            
            currentGame.totalQuestions = questionCount;
            currentGame.currentQuestion = 0;
            currentGame.selectedAnswer = null;

            // 隱藏選擇器，顯示遊戲區域
            document.getElementById('questionSelector').style.display = 'none';
            document.getElementById('gameArea').classList.add('active');

            // 開始第一題
            showQuestion();
        }

        function showQuestion() {
            const question = currentGame.questions[currentGame.currentQuestion];
            
            // 更新進度
            document.getElementById('questionCounter').textContent = 
                `${currentGame.currentQuestion + 1}/${currentGame.totalQuestions}`;

            // 顯示句子和頁碼
            document.getElementById('sentenceText').textContent = question.sentence;
            document.getElementById('pageSource').textContent = `來源：${question.page}`;

            // 顯示選項
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.onclick = () => selectOption(optionDiv, option, question.correct);
                
                optionDiv.innerHTML = `
                    <div class="option-number">${String.fromCharCode(65 + index)}</div>
                    <div class="option-text">${option}</div>
                `;
                
                optionsContainer.appendChild(optionDiv);
            });

            currentGame.selectedAnswer = null;
            
            // 更新導航按鈕狀態
            updateNavigationButtons();
        }

        function selectOption(optionElement, selectedAnswer, correctAnswer) {
            // 如果已經選擇過，不允許重複選擇
            if (currentGame.selectedAnswer !== null) return;

            currentGame.selectedAnswer = selectedAnswer;

            // 清除所有選項的選中狀態
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });

            // 立即標記選中的選項
            optionElement.classList.add('selected');

            // 立即檢查答案並播放音效
            if (selectedAnswer === correctAnswer) {
                optionElement.classList.add('correct');
                playCorrectSound();
            } else {
                optionElement.classList.add('incorrect');
                playIncorrectSound();
                
                // 錯誤答案，1秒後重置選擇狀態，允許重新選擇
                setTimeout(() => {
                    optionElement.classList.remove('selected', 'incorrect');
                    currentGame.selectedAnswer = null;
                }, 1000);
            }
        }

        function nextQuestion() {
            // 檢查是否已經是最後一題
            if (currentGame.currentQuestion >= currentGame.totalQuestions - 1) {
                // 已經是最後一題，不做任何操作
                return;
            }
            
            currentGame.currentQuestion++;
            showQuestion();
        }

        function previousQuestion() {
            // 檢查是否已經是第一題
            if (currentGame.currentQuestion <= 0) {
                // 已經是第一題，不做任何操作
                return;
            }
            
            currentGame.currentQuestion--;
            showQuestion();
        }

        function updateNavigationButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            // 如果是第一題，禁用上一題按鈕
            if (currentGame.currentQuestion === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }
            
            // 如果是最後一題，禁用下一題按鈕
            if (currentGame.currentQuestion >= currentGame.totalQuestions - 1) {
                nextBtn.disabled = true;
            } else {
                nextBtn.disabled = false;
            }
        }

        function showCompletion() {
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('completionScreen').classList.add('active');
        }

        function backToMenu() {
            document.getElementById('completionScreen').classList.remove('active');
            document.getElementById('questionSelector').style.display = 'flex';
            
            // 重置遊戲狀態
            currentGame = {
                questions: [],
                currentQuestion: 0,
                totalQuestions: 0,
                selectedAnswer: null
            };
        }

        function returnToMenu() {
            // 隱藏遊戲區域
            document.getElementById('gameArea').classList.remove('active');
            // 顯示選題選單
            document.getElementById('questionSelector').style.display = 'flex';
            
            // 重置遊戲狀態
            currentGame = {
                questions: [],
                currentQuestion: 0,
                totalQuestions: 0,
                selectedAnswer: null
            };
        }

        // Element SDK 初始化
        async function onConfigChange(config) {
            const title = config.game_title || defaultConfig.game_title;
            document.getElementById('gameTitle').textContent = title;
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig: defaultConfig,
                onConfigChange: onConfigChange,
                mapToCapabilities: (config) => ({
                    recolorables: [],
                    borderables: [],
                    fontEditable: undefined,
                    fontSizeable: undefined
                }),
                mapToEditPanelValues: (config) => new Map([
                    ["game_title", config.game_title || defaultConfig.game_title]
                ])
            });
        }

        // 初始化
        onConfigChange(defaultConfig);
    </script>

body.mm2-menu .header{flex:none;margin:0!important;padding:clamp(8px,1.6vh,16px) clamp(16px,2.4vw,32px)!important;background:var(--k);border-bottom:4px solid var(--y);display:flex;align-items:center;gap:clamp(10px,1.2vw,18px);text-align:left}
body.mm2-menu .header .mm2-tag{flex:none;background:var(--y);color:var(--k);font-weight:900;font-size:clamp(13px,1.5vw,18px);padding:.3em .8em;border-radius:999px;letter-spacing:.08em}
body.mm2-menu .title{margin:0!important;font-size:clamp(20px,3vw,40px)!important;line-height:1.2!important;background:none!important;-webkit-text-fill-color:var(--y)!important;color:var(--y)!important;text-shadow:none!important;font-weight:900;letter-spacing:.04em}
body:not(.mm2-menu) .header .mm2-tag{display:none}

body.mm2-menu #questionSelector{flex:1 1 0;min-height:0;margin:0!important;padding:clamp(10px,2vh,24px) clamp(16px,2.4vw,32px) 28px!important;gap:0!important;display:flex;flex-wrap:nowrap!important}
.mm2-wrap{flex:1 1 0;min-height:0;display:flex;gap:clamp(12px,2vw,28px);width:100%}
.mm2-map{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
html body .mm2-map>div:has(>img){margin:0!important;width:100%;flex:1 1 0;min-height:0;display:flex!important;align-items:center;justify-content:center}
html body .mm2-map>div>img{max-width:100%!important;max-height:100%!important;width:auto!important;height:auto!important;object-fit:contain;border-radius:14px!important;box-shadow:0 0 0 4px var(--w),0 10px 30px rgba(0,0,0,.6)!important;transition:transform .2s}
html body .mm2-map>div>img:hover{transform:scale(1.01)}
.mm2-hint{flex:none;margin-top:10px;color:var(--y);font-size:clamp(12px,1.2vw,16px);opacity:.85;letter-spacing:.06em}

.mm2-side{flex:0 0 clamp(240px,26vw,400px);min-height:0;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px);background:var(--k2);border:2px solid #3a3a3a;border-radius:18px;padding:clamp(12px,2vh,22px) clamp(12px,1.4vw,22px);overflow:auto}
.mm2-h{color:var(--y);font-weight:900;font-size:clamp(14px,1.5vw,20px);letter-spacing:.06em;display:flex;align-items:center;gap:.5em}
.mm2-h b{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--y);color:var(--k);font-size:.85em}
.mm2-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(6px,1vh,12px)}
html body .mm2-grid .question-btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;background:var(--w);color:var(--k);border:3px solid var(--w);border-radius:14px;padding:clamp(8px,1.8vh,18px) 4px;font-family:tauhu-oo,sans-serif;font-weight:900;font-size:clamp(16px,1.9vw,28px);line-height:1;transition:transform .12s,background .12s,color .12s}
html body .mm2-grid .question-btn small{display:block;font-size:.5em;font-weight:700;margin-top:.35em;opacity:.6}
html body .mm2-grid .question-btn:hover,html body .mm2-grid .question-btn:focus-visible{background:var(--y);border-color:var(--y);transform:translateY(-3px);outline:none}
html body .mm2-grid #md-all-btn{grid-column:1/-1;background:var(--y);border-color:var(--y)}
html body .mm2-grid #md-all-btn:hover{background:var(--w);border-color:var(--w)}
.mm2-sep{height:1px;background:#444;margin:clamp(2px,.6vh,8px) 0}
.mm2-tools{display:flex;flex-direction:column;gap:clamp(6px,1vh,12px)}
html body .mm2-tools a.question-btn.md-mmquiz,html body .mm2-tools #md-pdf-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex!important;align-items:center;gap:.6em;width:100%;padding:clamp(8px,1.5vh,14px) clamp(10px,1vw,16px);border-radius:14px;font-family:tauhu-oo,sans-serif;font-weight:900;font-size:clamp(14px,1.45vw,22px);line-height:1.2;position:static!important;transition:background .12s,color .12s,transform .12s}
html body .mm2-tools a.question-btn.md-mmquiz{background:var(--k);color:var(--y)!important;border:3px solid var(--y)}
html body .mm2-tools #md-pdf-btn{background:var(--k);color:var(--w);border:3px solid var(--w)}
html body .mm2-tools a.question-btn.md-mmquiz:hover{background:var(--y);color:var(--k)!important;transform:translateY(-2px)}
html body .mm2-tools #md-pdf-btn:hover,html body .mm2-tools #md-pdf-btn:focus-visible{background:var(--w);color:var(--k);transform:translateY(-2px);outline:none}
html body .mm2-tools #md-pdf-btn svg{width:1.2em;height:1.2em;flex:none}
html body .mm2-tools #md-pdf-btn.busy{opacity:.6;cursor:progress}
.mm2-tools .mm2-sub{display:block;font-size:.62em;font-weight:500;opacity:.75;margin-top:.15em}

@media (orientation:landscape) and (max-height:520px){
 body.mm2-menu .header{padding:4px 16px!important;border-bottom-width:3px}
 body.mm2-menu .title{font-size:clamp(16px,6vh,26px)!important}
 body.mm2-menu .header .mm2-tag{font-size:12px}
 body.mm2-menu #questionSelector{padding:8px 12px 24px!important}
 .mm2-side{gap:6px;padding:8px 10px}
 .mm2-h{font-size:13px}
 .mm2-sep,.mm2-hint,.mm2-tools .mm2-sub,html body .mm2-grid .question-btn small{display:none}
 .mm2-grid{display:flex;flex-wrap:wrap;gap:5px}
 html body .mm2-grid .question-btn{flex:1 1 0;min-width:0;padding:7px 2px;font-size:16px}
 html body .mm2-grid #md-all-btn{flex-basis:100%}
 html body .mm2-tools a.question-btn.md-mmquiz,html body .mm2-tools #md-pdf-btn{padding:6px 10px;font-size:14px;border-width:2px}
}
@media (orientation:portrait){
 html:has(body.mm2-menu),html body.mm2-menu{height:auto!important;overflow-y:auto!important}
 html body.mm2-menu .container{height:auto!important;min-height:100vh;min-height:100dvh;padding-bottom:0!important}
 html body .mm2-map>div:has(>img){flex:none!important}
 html body .mm2-grid .question-btn{padding:clamp(8px,1.4vh,14px) 4px}
 body.mm2-menu #questionSelector{flex:none}
 .mm2-wrap{flex-direction:column}
 .mm2-side{order:-1;flex:none;overflow:visible}
 .mm2-map{flex:none}
 html body .mm2-map>div>img{max-height:none!important;width:100%!important}
 html body .mm2-grid .question-btn{font-size:clamp(18px,5.4vw,26px)}
 html body .mm2-tools a.question-btn.md-mmquiz,html body .mm2-tools #md-pdf-btn{font-size:clamp(16px,4.6vw,22px)}
}
</style>
<script id="md-mmmenu2-js">
(function(){
 var d=document,qs=d.getElementById('questionSelector');if(!qs||qs.querySelector('.mm2-wrap'))return;
 var img=qs.querySelector('img'),imgBox=img&&img.parentElement;
 var btns=[].slice.call(qs.querySelectorAll('button.question-btn'));
 var quiz=qs.querySelector('a.md-mmquiz');
 var pdf=d.getElementById('md-pdf-btn');
 var hd=d.querySelector('.header');
 if(hd&&!hd.querySelector('.mm2-tag')){var t=d.createElement('span');t.className='mm2-tag';t.textContent='心智圖配對';hd.insertBefore(t,hd.firstChild);}
 var gt=d.getElementById('gameTitle');
 var orig=null;
 function tidy(){if(!gt)return;var c=gt.textContent.trim(),s=c.replace(/\s*心智圖配對$/,'').trim();if(s&&s!==c){orig=c;gt.textContent=s;}}
 function restore(){if(gt&&orig){var o=orig;orig=null;gt.textContent=o;}}
 var wrap=d.createElement('div');wrap.className='mm2-wrap';
 var map=d.createElement('section');map.className='mm2-map';
 var side=d.createElement('aside');side.className='mm2-side';
 side.innerHTML='<div class="mm2-h"><b>1</b>選擇題數，開始練習</div><div class="mm2-grid"></div><div class="mm2-sep"></div><div class="mm2-h"><b>2</b>測驗與講義</div><div class="mm2-tools"></div>';
 var grid=side.querySelector('.mm2-grid'),tools=side.querySelector('.mm2-tools');
 btns.forEach(function(b){
  if(b.id!=='md-all-btn'){var m=b.textContent.match(/(\d+)/);if(m)b.innerHTML=m[1]+'<small>題</small>';}
  else b.innerHTML='全部題目';
  grid.appendChild(b);
 });
 (function(){var nums=btns.filter(function(b){return b.id!=='md-all-btn';}),n=nums.length,last=n%3||3;
  nums.forEach(function(b,i){b.style.gridColumn='span '+(i>=n-last?6/last:2);});})();
 if(quiz){quiz.innerHTML='<span aria-hidden="true">📝</span><span>線上測驗<span class="mm2-sub">作答後成績上傳給老師</span></span>';tools.appendChild(quiz);}
 if(pdf){
  var svg=pdf.querySelector('svg');pdf.innerHTML='';if(svg)pdf.appendChild(svg);
  var s=d.createElement('span');s.innerHTML='下載 A3 講義<span class="mm2-sub">PDF，可直接列印</span>';pdf.appendChild(s);
  pdf.style.left=pdf.style.top='';tools.appendChild(pdf);
 }
 if(imgBox){map.appendChild(imgBox);imgBox.querySelector('img').title='點一下全螢幕放大';}
 [].slice.call(qs.childNodes).forEach(function(n){if(n.nodeType===3)qs.removeChild(n);});
 wrap.appendChild(map);wrap.appendChild(side);qs.appendChild(wrap);
 function sync(){var on=qs.style.display!=='none';d.body.classList.toggle('mm2-menu',on);if(on)tidy();else restore();}
 new MutationObserver(sync).observe(qs,{attributes:true,attributeFilter:['style']});
 if(gt)new MutationObserver(function(){if(d.body.classList.contains('mm2-menu'))tidy();}).observe(gt,{childList:true,characterData:true,subtree:true});
 sync();
})();
</script>
<!-- /md-mmmenu2 -->
</body>
</html>
