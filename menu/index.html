<style>
:root{--black:#111111;--yellow:#FFD400;--white:#FFFFFF;--gray:#2A2A2A;--light:#F5F5F5;--muted:#A8A8A8;--pub:#FFD400;--pubfg:#111111}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--black);color:var(--white);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  background-image:radial-gradient(circle at 100% 0,rgba(255,212,0,.10),transparent 42%),radial-gradient(circle at 0 100%,rgba(255,255,255,.05),transparent 40%);min-height:100vh}
.wrap{width:100%;max-width:none;margin:0;padding:12px clamp(10px,1.4vw,28px) 20px}  /* 左右滿版不留白邊（v44） */
header.top{position:relative;overflow:hidden;text-align:center;margin:0 0 12px;padding:14px 16px 12px;border-radius:16px;
  background:linear-gradient(115deg,transparent 0 58%,rgba(255,255,255,.05) 58% 72%,transparent 72%),linear-gradient(245deg,transparent 0 70%,rgba(255,212,0,.08) 70% 82%,transparent 82%),var(--gray);
  border:1px solid #3a3a3a;box-shadow:inset 0 -4px 0 var(--yellow)}
header.top h1{margin:0;font-size:clamp(26px,4.6vw,40px);font-weight:900;line-height:1.15;color:var(--white);letter-spacing:.08em}
header.top h1 .hl{color:var(--yellow)}
header.top .roma{display:block;margin-top:4px;color:var(--yellow);font-weight:700;font-size:clamp(14px,2.2vw,19px);letter-spacing:.02em}
/* 出版社：一列膠囊 */
.pubs{display:flex;gap:8px}
.pub{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 10px;border-radius:12px;border:2px solid #3a3a3a;background:var(--gray);
  color:var(--white);font:inherit;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.pub:hover{transform:translateY(-2px);border-color:var(--yellow)}
.pub .ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:18px;font-weight:900;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.pub b{font-size:17px;line-height:1.2;white-space:nowrap}
.pub small{color:var(--muted);font-size:12px;white-space:nowrap}
.pub[aria-selected=true]{background:var(--yellow);border-color:var(--yellow);color:var(--black)}
.pub[aria-selected=true] small{color:#3b3200}
.pub.all .ic{background:var(--black);color:var(--yellow);border:2px solid var(--yellow)}
/* 冊別 */
.vols{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.04);border-left:5px solid var(--pub)}
.vols:empty{display:none}
.vol{border:2px solid var(--white);background:transparent;color:var(--white);font-family:inherit;font-weight:700;font-size:15px;line-height:1;padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.vol:hover{background:rgba(255,212,0,.18)}
.vol[aria-selected=true]{background:var(--white);color:var(--black);box-shadow:0 0 0 3px var(--pub)}
/* 課次 */
.book{margin-top:12px}
.bookhead{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:17px}
.bookhead .ic{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:14px;font-weight:900}
.bookhead .n{color:var(--muted);font-size:13px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;min-height:96px;padding:12px 16px 12px 22px;border-radius:14px;background:var(--white);color:var(--black);
  text-decoration:none;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.4);transition:transform .15s,box-shadow .15s,background .15s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c,var(--pub))}
.card .no{align-self:flex-start;background:var(--black);color:var(--yellow);font-weight:900;font-size:14px;padding:4px 10px;border-radius:999px;letter-spacing:.05em}
.card .t{font-size:19px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.card .go{position:absolute;right:12px;bottom:10px;font-size:20px;opacity:.25;transition:opacity .15s,transform .15s}
.card:hover,.card:focus-visible{transform:translateY(-4px);background:var(--yellow);box-shadow:0 10px 22px rgba(0,0,0,.45);outline:none}
.card:hover .go,.card:focus-visible .go{opacity:1;transform:translateX(3px)}
.empty{color:var(--muted);padding:24px 0}
/* 課堂玩法圖 */
.howto{margin-top:22px}
.howto h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:18px;color:var(--yellow)}
.howto h2::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--yellow)}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.shots figure{margin:0;border-radius:14px;overflow:hidden;background:var(--gray);border:1px solid #3a3a3a}
.shots img{display:block;width:100%;height:auto;aspect-ratio:1280/700;object-fit:cover;background:#222}
.shots figcaption{padding:7px 10px;font-size:14px;font-weight:700;color:var(--white);text-align:center}
.howto.hide{display:none}
/* 頁尾：常用連結＋造訪人數 */
footer{margin-top:22px;padding:14px 12px 4px;border-top:2px solid var(--yellow);color:var(--muted);font-size:12px;line-height:1.7;text-align:center}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-bottom:10px}
.links a{color:var(--white);font-size:15px;font-weight:700;text-decoration:none;border-bottom:2px solid transparent}
.links a:hover{color:var(--yellow);border-bottom-color:var(--yellow)}
.counter{display:flex;justify-content:center;margin:10px 0 8px}
.counter img{height:30px}
.shots img{cursor:zoom-in}
/* 圖片全螢幕瀏覽 */
#lb{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.94);cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100vw;max-height:calc(100vh - 54px);max-height:calc(100dvh - 54px);object-fit:contain;user-select:none}
#lb .cap{margin-top:10px;color:var(--yellow);font-size:clamp(16px,2.4vw,24px);font-weight:900;text-align:center;padding:0 70px}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:clamp(48px,6vw,72px);height:clamp(48px,6vw,72px);border-radius:50%;border:3px solid var(--yellow);
  background:rgba(17,17,17,.75);color:var(--yellow);font-size:clamp(26px,3.4vw,40px);font-weight:900;line-height:1;cursor:pointer;display:grid;place-items:center}
#lb .nav:hover{background:var(--yellow);color:var(--black)}
#lb .prev{left:clamp(8px,2vw,24px)}
#lb .next{right:clamp(8px,2vw,24px)}
#lb .count{position:absolute;top:12px;right:16px;color:var(--white);opacity:.7;font-size:14px}
/* 橫式畫面（投影、電子白板、筆電）：字級與卡片隨寬度放大，欄數自動增減（v44） */
@media (orientation:landscape) and (min-width:900px){
  header.top{padding:clamp(14px,1.4vw,28px) 16px clamp(12px,1.1vw,22px);margin-bottom:clamp(12px,1vw,20px)}
  header.top h1{font-size:clamp(34px,3.3vw,64px)}
  header.top .roma{font-size:clamp(17px,1.5vw,30px)}
  .pubs{gap:clamp(8px,.8vw,16px)}
  .pub{padding:clamp(7px,.6vw,14px) 10px;gap:clamp(8px,.6vw,14px)}
  .pub .ic{width:clamp(30px,2.2vw,46px);height:clamp(30px,2.2vw,46px);font-size:clamp(18px,1.4vw,28px)}
  .pub b{font-size:clamp(17px,1.4vw,28px)}
  .pub small{font-size:clamp(12px,.9vw,18px)}
  .vols{padding:clamp(7px,.6vw,12px) 10px;gap:clamp(6px,.5vw,12px)}
  .vol{font-size:clamp(15px,1.1vw,22px);padding:clamp(7px,.55vw,12px) clamp(14px,1.1vw,24px)}
  .bookhead{font-size:clamp(17px,1.35vw,28px)}
  .bookhead .ic{width:clamp(24px,1.8vw,38px);height:clamp(24px,1.8vw,38px);font-size:clamp(14px,1.1vw,22px)}
  .bookhead .n{font-size:clamp(13px,.95vw,19px)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(clamp(230px,19vw,460px),1fr));gap:clamp(12px,1vw,22px)}
  .card{min-height:clamp(96px,7.6vw,170px);padding:clamp(12px,1vw,22px) 16px clamp(12px,1vw,22px) clamp(22px,1.6vw,32px);gap:clamp(8px,.7vw,14px)}
  .card::before{width:clamp(8px,.55vw,12px)}
  .card .no{font-size:clamp(14px,1vw,21px)}
  .card .t{font-size:clamp(19px,1.55vw,32px)}
  .card .go{font-size:clamp(20px,1.4vw,30px)}
  .howto h2{font-size:clamp(18px,1.35vw,28px)}
  .shots{gap:clamp(12px,1vw,22px)}
  .shots figcaption{font-size:clamp(14px,1.05vw,22px)}
  .links a{font-size:clamp(15px,1vw,20px)}
}
@media (max-width:760px){ .pub small{display:none} .shots{grid-template-columns:1fr 1fr} }
@media (max-width:520px){
  .wrap{padding:8px 8px 14px}
  header.top{padding:10px 10px 9px;margin-bottom:8px;border-radius:12px}
  .pubs{gap:5px}
  .pub{flex-direction:column;gap:3px;padding:5px 2px;border-radius:10px}
  .pub .ic{width:26px;height:26px;font-size:16px;border-radius:7px}
  .pub b{font-size:13px}.pub .s{display:none}
  .vols{margin-top:7px;padding:5px 6px;gap:5px}
  .vol{font-size:14px;padding:7px 11px}
  .book{margin-top:9px}
  .bookhead{font-size:15px;margin-bottom:6px}
  .grid{grid-template-columns:1fr;gap:7px}
  .card{min-height:0;flex-direction:row;align-items:center;gap:10px;padding:9px 12px 9px 18px}
  .card .no{font-size:13px;padding:3px 8px;flex:none}
  .card .t{font-size:16px;padding-right:20px}
  .shots{grid-template-columns:1fr}
}
</style>
</head>

  </footer>
</div>
<div id="lb" role="dialog" aria-modal="true" aria-label="圖片全螢幕">
  <span class="count" id="lbCount"></span>

(function(){
  var figs=[].slice.call(document.querySelectorAll('.shots figure')), lb=document.getElementById('lb'),
      im=document.getElementById('lbImg'), cap=document.getElementById('lbCap'), cnt=document.getElementById('lbCount'), i=0;
  function show(k){ i=(k+figs.length)%figs.length; var f=figs[i], s=f.querySelector('img');
    im.src=s.src; im.alt=s.alt; cap.textContent=f.querySelector('figcaption').textContent; cnt.textContent=(i+1)+' / '+figs.length; }
  function isFs(){ return document.fullscreenElement||document.webkitFullscreenElement; }
  function open(k){ show(k); lb.classList.add('on'); try{ var r=lb.requestFullscreen||lb.webkitRequestFullscreen; if(r){ var p=r.call(lb); if(p&&p.catch) p.catch(function(){}); } }catch(e){} }
  function close(){ lb.classList.remove('on'); try{ if(isFs()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } }catch(e){} }
  figs.forEach(function(f,k){ f.querySelector('img').addEventListener('click',function(){ open(k); }); });
  document.getElementById('lbPrev').addEventListener('click',function(e){ e.stopPropagation(); show(i-1); });
  document.getElementById('lbNext').addEventListener('click',function(e){ e.stopPropagation(); show(i+1); });
  lb.addEventListener('click',close);
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('on')) return;
    var k=e.key;
    if(k==='PageUp'||k==='ArrowLeft'||k==='ArrowUp'){ e.preventDefault(); show(i-1); }
    else if(k==='PageDown'||k==='ArrowRight'||k==='ArrowDown'||k===' '||k==='Enter'){ e.preventDefault(); show(i+1); }
    else if(k==='Escape'){ close(); }
  });
  function fsChange(){ if(!isFs()&&lb.classList.contains('on')&&lb.dataset.fs==='1'){ lb.classList.remove('on'); } lb.dataset.fs=isFs()?'1':''; }
  document.addEventListener('fullscreenchange',fsChange); document.addEventListener('webkitfullscreenchange',fsChange);
})();
