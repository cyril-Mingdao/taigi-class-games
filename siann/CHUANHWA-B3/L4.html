        // 遊戲狀態

        // 選單頁面邏輯
        document.addEventListener('DOMContentLoaded', function() {
            // 遊戲模式選擇
            document.querySelectorAll('.game-mode-button').forEach(button => {

                    document.querySelectorAll('.game-mode-button').forEach(b => b.classList.remove('selected'));

                    checkStartButton();
                });

            // 題目數量選擇
            document.querySelectorAll('.question-count-button').forEach(button => {
                button.addEventListener('click', function() {
                    document.querySelectorAll('.question-count-button').forEach(b => b.classList.remove('selected'));

        function checkStartButton() {
            const startButton = document.getElementById('startGameButton');
            if (selectedGameMode && selectedQuestionCount) {
                startButton.disabled = false;
            } else {
                startButton.disabled = true;
            }
        }

        // 音效
        function playCorrectSound() {
            try {
                // 創建正確音效 - 愉快的鈴聲
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
                oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // G5
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (error) {
                // 備用音效
                const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT');
                audio.volume = 0.3;
                audio.play().catch(() => {});
            }
        }

        function playIncorrectSound() {
            try {
                // 創建錯誤音效 - 低沉的錯誤聲
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(220, audioContext.currentTime); // A3
                oscillator.frequency.setValueAtTime(196, audioContext.currentTime + 0.15); // G3
                oscillator.frequency.setValueAtTime(174.61, audioContext.currentTime + 0.3); // F3
                
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.6);
                
                oscillator.type = 'sawtooth';
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.6);
            } catch (error) {
                // 備用音效
                const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT');
                audio.volume = 0.2;
                audio.play().catch(() => {});
            }
        }

        // 獲取音檔 URL
                /* 發音取第一種完整讀音（2026-11-15 修正：多音寫法不再只唸第一個音節）— © 2026 詹宗龍 */
        function mdTl(raw, han) {
            let s = String(raw || '').trim();
            if (!s || /^https?:\/\//.test(s)) return s;
            s = s.split(/\s+\/\s+/)[0].replace(/\/\s+/g, '/');
            const n = (String(han || '').match(/[㐀-鿿豈-﫿]|[\ud840-\ud8bf][\udc00-\udfff]/g) || []).length;
            const cnt = t => t.split(/[\s\-]+/).filter(Boolean).length;
            const tok = s.replace(/[^\s\-]+/g, w => w.split('/')[0]);
            const first = s.split('/')[0].trim();
            if (!n || cnt(tok) === n) return tok;
            if (cnt(first) === n) return first;
            return tok;
        }

        function getAudioUrl(romanization, han) {
            const audioRoman = mdTl(romanization, han);
            return audioRoman;
        }

        // 播放當前音檔
        function playCurrentAudio() {
            if (currentQuestionIndex >= currentQuestions.length) return;
            
            const currentQuestion = currentQuestions[currentQuestionIndex];
            const audioUrl = getAudioUrl(currentQuestion.romanization, currentQuestion.taiwanese);
            
            const button = document.getElementById('playAudioButton');
            if (typeof holo === 'function') {
                holo(button, audioUrl);
            }
        }

        // 自動播放音檔
        function autoPlayAudio() {
            if (selectedGameMode === 1 || selectedGameMode === 2) {
                setTimeout(() => {
                    playCurrentAudio();
                }, 500);
            }
        }

        // 開始遊戲
        function startGame() {
            // 隨機選擇題目
            const shuffled = [...gameData].sort(() => Math.random() - 0.5);
            currentQuestions = shuffled.slice(0, selectedQuestionCount);
            
            currentQuestionIndex = 0;
            correctAnswers = 0;
            
            // 切換到遊戲頁面
            document.getElementById('menuContainer').style.display = 'none';
            document.getElementById('gameContainer').classList.add('active');
            
            // 根據遊戲模式顯示/隱藏音檔按鈕
            const audioSection = document.getElementById('audioSection');
            if (selectedGameMode === 1 || selectedGameMode === 2) {
                audioSection.style.display = 'block';
            } else {
                audioSection.style.display = 'none';
            }
            
            showQuestion();
        }

        // 顯示題目
        function showQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                showResults();
                return;
            }

            const question = currentQuestions[currentQuestionIndex];
            const questionText = document.getElementById('questionText');
            const progressText = document.getElementById('progressText');
            const progressFill = document.getElementById('progressFill');
            const questionInfo = document.getElementById('questionInfo');
            const navigationButtons = document.getElementById('navigationButtons');

            // 更新進度
            progressText.textContent = `第 ${currentQuestionIndex + 1} 題 / 共 ${selectedQuestionCount} 題`;
            progressFill.style.width = `${(currentQuestionIndex / selectedQuestionCount) * 100}%`;

            // 根據遊戲模式設置題目文字和顯示題目資訊
            switch (selectedGameMode) {
                case 1:
                    questionText.textContent = '請聽音檔，選擇正確的台語';
                    questionInfo.style.display = 'none';
                    break;
                case 2:
                    questionText.textContent = '請聽音檔，選擇正確的台羅';
                    questionInfo.style.display = 'none';
                    break;
                case 3:
                    questionText.textContent = question.taiwanese;
                    showQuestionInfoForVisualMode(question);
                    break;
                case 4:
                    questionText.textContent = question.romanization;
                    showQuestionInfoForVisualMode(question);
                    break;
            }

            // 顯示導航按鈕
            navigationButtons.style.display = 'flex';
            updateNavigationButtons();

            // 生成選項
            generateOptions();
            
            // 自動播放音檔
            autoPlayAudio();
        }

        // 顯示題目詳細資訊
        function showQuestionInfo(question) {
            const questionInfo = document.getElementById('questionInfo');
            document.getElementById('infoId').textContent = question.id;
            document.getElementById('infoPage').textContent = question.page;
            document.getElementById('infoChinese').textContent = question.chinese;
            questionInfo.style.display = 'block';
        }

        // 顯示視覺模式的題目資訊（只顯示項次、頁數、華語）
        function showQuestionInfoForVisualMode(question) {
            const questionInfo = document.getElementById('questionInfo');
            document.getElementById('infoId').textContent = question.id;
            document.getElementById('infoPage').textContent = question.page;
            document.getElementById('infoChinese').textContent = question.chinese;
            questionInfo.style.display = 'block';
        }

        // 更新導航按鈕狀態
        function updateNavigationButtons() {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            
            prevButton.disabled = (currentQuestionIndex === 0);
            nextButton.disabled = (currentQuestionIndex >= currentQuestions.length - 1);
        }

        // 生成選項
        function generateOptions() {
            const question = currentQuestions[currentQuestionIndex];
            let correctAnswer, wrongAnswers;

            // 根據遊戲模式決定正確答案和錯誤選項
            switch (selectedGameMode) {
                case 1:
                    correctAnswer = question.taiwanese;
                    wrongAnswers = getRandomWrongAnswers(question, 'taiwanese');
                    break;
                case 2:
                    correctAnswer = question.romanization;
                    wrongAnswers = getRandomWrongAnswers(question, 'romanization');
                    break;
                case 3:
                    correctAnswer = question.romanization;
                    wrongAnswers = getRandomWrongAnswers(question, 'romanization');
                    break;
                case 4:
                    correctAnswer = question.taiwanese;
                    wrongAnswers = getRandomWrongAnswers(question, 'taiwanese');
                    break;
            }

            // 隨機排列選項
            const allOptions = [correctAnswer, ...wrongAnswers];
            const shuffledOptions = allOptions.sort(() => Math.random() - 0.5);
            currentCorrectAnswer = shuffledOptions.indexOf(correctAnswer);

            // 設置選項文字和樣式
            const optionElements = ['optionTextA', 'optionTextB', 'optionTextC', 'optionTextD'];
            const buttonElements = ['optionA', 'optionB', 'optionC', 'optionD'];

            for (let i = 0; i < 4; i++) {
                const optionElement = document.getElementById(optionElements[i]);
                const buttonElement = document.getElementById(buttonElements[i]);
                
                optionElement.textContent = shuffledOptions[i];
                
                // 重置按鈕狀態
                buttonElement.className = 'option-button';
                buttonElement.disabled = false;
                
                // 根據文字長度調整字體大小
                adjustFontSize(optionElement, shuffledOptions[i]);
            }
        }

        // 調整字體大小
        function adjustFontSize(element, text) {
            element.className = 'option-text';
            
            if ((text.length > 15) || (text.includes('/') && text.length > 10)) {
                element.classList.add('small');
            } else if ((text.length > 10) || text.includes('-') || text.includes('̍') || text.includes('̄')) {
                element.classList.add('medium');
            }
        }

        // 獲取隨機錯誤答案
        function getRandomWrongAnswers(currentQuestion, type) {
            const otherQuestions = gameData.filter(q => 
                q.taiwanese !== currentQuestion.taiwanese && 
                q.romanization !== currentQuestion.romanization
            );
            
            const shuffled = otherQuestions.sort(() => Math.random() - 0.5);
            return shuffled.slice(0, 3).map(q => q[type]);
        }

        // 選擇答案
        function selectAnswer(selectedIndex) {
            const buttonElements = ['optionA', 'optionB', 'optionC', 'optionD'];
            const selectedButton = document.getElementById(buttonElements[selectedIndex]);

            // 檢查是否已經選過這個選項
            if (selectedButton.classList.contains('correct') || selectedButton.classList.contains('incorrect')) {
                return;
            }

            if (selectedIndex === currentCorrectAnswer) {
                // 正確答案
                selectedButton.classList.add('correct');
                correctAnswers++;
                playCorrectSound();
                
                // 禁用所有按鈕，因為已經答對了
                buttonElements.forEach(id => {
                    document.getElementById(id).classList.add('disabled');
                });
            } else {
                // 錯誤答案
                selectedButton.classList.add('incorrect');
                selectedButton.classList.add('disabled'); // 只禁用這個錯誤的選項
                playIncorrectSound();
                // 其他選項仍可繼續選擇
            }
        }

        // 上一題
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                resetQuestionState();
                showQuestion();
            }
        }

        // 下一題
        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                resetQuestionState();
                showQuestion();
            } else {
                showResults();
            }
        }

        // 重置題目狀態
        function resetQuestionState() {
            const buttonElements = ['optionA', 'optionB', 'optionC', 'optionD'];
            const optionTexts = ['optionTextA', 'optionTextB', 'optionTextC', 'optionTextD'];
            
            for (let i = 0; i < 4; i++) {
                const button = document.getElementById(buttonElements[i]);
                const optionText = document.getElementById(optionTexts[i]);
                
                button.className = 'option-button';
                button.disabled = false;
                optionText.className = 'option-text';
            }
        }

        // 顯示結果
        function showResults() {
            document.getElementById('questionArea').style.display = 'none';
            document.getElementById('resultsScreen').classList.add('active');
            document.getElementById('resultsScore').textContent = `你答對了 ${correctAnswers} / ${selectedQuestionCount} 題`;
            
            // 更新進度為完成
            document.getElementById('progressText').textContent = '遊戲完成！';
            document.getElementById('progressFill').style.width = '100%';
        }

        // 返回選單
        function backToMenu() {
            // 重置遊戲狀態
            selectedGameMode = null;
            selectedQuestionCount = null;
