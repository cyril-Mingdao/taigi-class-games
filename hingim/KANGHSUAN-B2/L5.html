    <style>/*md-dvh*/
        :root {
            /* 橘色系主題 */
            --bg-start: #FFF8E1; 
            --bg-end: #FFCC80;   
            --primary-color: #ff9600; 
            --primary-shadow: #cc7a00;
            --correct-color: #58cc02; 
            --correct-shadow: #46a302;
            --wrong-color: #ff4b4b;   
            --wrong-shadow: #d12020;
            --text-color: #4b4b4b;
            --font-main: 'tauhu-oo', sans-serif;
            --box-border: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
            height: 100vh;height:100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: var(--text-color);
        }

        body[oncontextmenu="return false;"] { cursor: default; }

        /* --- 1. 入口選單 --- */
        #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            z-index: 10;
        }

        h1 { margin-bottom: 0.2em; font-size: 2.5rem; color: #d35400; line-height: 1; }
        h2 { margin-top: 0; font-size: 1.2rem; color: #8d6e63; font-weight: normal; margin-bottom: 2rem; line-height: 1; }

        .settings-box {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }

        .option-group { margin-bottom: 1.5rem; text-align: left; }
        .option-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; font-size: 1.1rem; color: #5d4037; }
        
        /* 數量選擇網格 3x2 配置 */
        .qty-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .qty-btn {
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qty-btn.selected {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-shadow);
            box-shadow: 0 2px 0 var(--primary-shadow);
        }

        .btn-start {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 0;
            width: 100%;
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 4px 0 var(--primary-shadow);
            cursor: pointer;
            transition: transform 0.1s;
            margin-top: 10px;
        }

        .btn-start:active { transform: translateY(4px); box-shadow: none; }

        /* --- 2. 遊戲介面配置 --- */
        #game-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 10px 0 10px; 
        }

        /* 內容主區域 - 佔據所有剩餘空間 */
        .content-area {
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
            margin-bottom: 10px;
            align-items: stretch; 
        }

        /* 左側資訊區 */
        .info-panel {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            padding: 10px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
            border: 2px solid #fff;
            flex-shrink: 0; 
        }

        .info-row {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            font-size: 1.4rem; 
        }
        .info-label {
            font-weight: bold;
            color: #795548;
            width: 70px;
            flex-shrink: 0;
        }
        .info-val {
            font-weight: bold;
            color: #333;
            font-size: 1.4rem; 
        }

        .taiyu-box {
            background: #fff3e0;
            border-radius: 10px;
            padding: 5px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; 
            border: 2px solid #ffe0b2;
        }
        .taiyu-text {
            font-size: 2.5rem; 
            color: #d35400;
            font-weight: bold;
        }
        .play-audio-btn {
            font-size: 2.2rem; 
            cursor: pointer;
            color: #29b6f6;
            background: white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 0 #ddd;
            flex-shrink: 0;
        }
        .play-audio-btn:active { transform: scale(0.95); box-shadow: none; }

        .mandarin-label {
            font-weight: bold; 
            color: #795548; 
            width: 100%; 
            margin-bottom: 2px; 
            font-size: 1.1rem;
            text-align: left; 
        }

        /* 華語文字區域 */
        .mandarin-text {
            font-size: 1.6rem; 
            color: #555;
            line-height: 1.3;
            max-height: 80px; 
            overflow-y: auto; 
            padding-right: 5px;
            text-align: center; 
            
            scrollbar-width: thin;
            scrollbar-color: #ccc transparent;
        }
        .mandarin-text::-webkit-scrollbar { width: 6px; }
        .mandarin-text::-webkit-scrollbar-thumb { background-color: #ccc; border-radius: 3px; }
        .mandarin-text.fs-md { font-size: 1.4rem; }
        .mandarin-text.fs-sm { font-size: 1.2rem; }

        /* 右側答題矩陣區 */
        .matrix-panel {
            background: white;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            gap: 4px; 
            
            flex: 1;           
            min-height: 0;     
            overflow-y: auto;  
            overflow-x: auto;  
            
            align-items: flex-start; 
        }

        .syllable-row {
            display: flex;
            gap: 8px;
            width: max-content; 
            min-width: 100%;    
            padding-bottom: 5px; 
        }

        /* 單個目標方塊 */
        .target-box {
            flex: 1;
            border: 2px solid var(--box-border);
            border-radius: 10px;
            background: #fdfdfd;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 90px; 
            transition: all 0.3s;
            min-width: 60px; 
        }

        .target-header {
            background: #f0f0f0;
            color: #777;
            font-size: 1.2rem; 
            padding: 4px;
            text-align: center;
            border-bottom: 1px solid var(--box-border);
            white-space: nowrap; 
        }

        .target-value {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem; 
            font-weight: bold;
            color: #ccc; 
            white-space: nowrap;
            /* 預防單格文字過多溢出 */
            overflow-y: auto;
        }

        .target-value.filled { color: var(--correct-color); }

        /* 呼吸效果 */
        @keyframes breathe {
            0% { border-color: #ff4b4b; box-shadow: 0 0 0 0 rgba(255, 75, 75, 0.4); }
            50% { border-color: #ff4b4b; box-shadow: 0 0 8px 4px rgba(255, 75, 75, 0.2); }
            100% { border-color: #ff4b4b; box-shadow: 0 0 0 0 rgba(255, 75, 75, 0); }
        }

        .target-box.active-step {
            animation: breathe 1.5s infinite;
            border-width: 2px;
            background-color: #fffafaf0;
        }
        .target-box.active-step .target-header {
            background-color: #ff4b4b;
            color: white;
        }
        .target-box.active-step .target-value {
            color: #ff4b4b;
        }

        /* 選項區域 */
        .options-area {
            flex-shrink: 0;
            height: auto;
            min-height: 140px;
            margin-bottom: 5px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .option-card {
            background: white;
            border: 2px solid #e5e5e5;
            border-radius: 15px;
            padding: 8px;
            box-shadow: 0 4px 0 #e5e5e5;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            min-height: 80px; 
            overflow: hidden; 
        }
        .option-card:active { transform: translateY(4px); box-shadow: none; }

        .opt-idx-box {
            width: 54px; 
            height: 54px; 
            font-size: 1.5rem; 
            background: #eee;
            color: #888;
            border-radius: 12px; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
            border: 2px solid #ddd;
        }

        .opt-text {
            font-size: 2.1rem; 
            font-weight: bold;
            color: var(--text-color);
            flex-grow: 1;
            text-align: center;
            word-break: break-word; 
            line-height: 1.1;       
        }

        /* 手機版 (6.2吋約對應寬度400-480px以下)，縮小字體 */
        @media (max-width: 480px) {
            .opt-text { font-size: 1.6rem; }
            .text-fit-sm { font-size: 1.3rem; }
            .text-fit-md { font-size: 1.5rem; }
            .text-fit-lg { font-size: 1.8rem; }
            .opt-idx-box { width: 45px; height: 45px; font-size: 1.2rem; margin-right: 8px; }
        }

        .option-card.correct {
            background-color: var(--correct-color);
            border-color: var(--correct-color);
            box-shadow: 0 4px 0 var(--correct-shadow);
        }
        .option-card.correct .opt-idx-box { background-color: #46a302; color: white; border-color: #388e3c; }
        .option-card.correct .opt-text { color: white; }

        .option-card.wrong {
            background-color: var(--wrong-color);
            border-color: var(--wrong-color);
            box-shadow: 0 4px 0 var(--wrong-shadow);
        }
        .option-card.wrong .opt-idx-box { background-color: #d12020; color: white; border-color: #b71c1c; }
        .option-card.wrong .opt-text { color: white; }

        /* --- 底部整合工具列 --- */
        .footer-bar {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(255,255,255,0);
            border-top: none; 
            padding: 0 10px;
            flex-shrink: 0;
            width: 100%;
        }

        /* 底部左側 (選單 + 題號) */
        .footer-left {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 140px; 
        }
        .nav-btn {
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 5px 15px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            box-shadow: 0 2px 0 #ddd;
            font-size: 0.9rem;
        }
        .nav-btn:active { transform: translateY(2px); box-shadow: none; }
        
        .q-counter {
            font-weight: bold;
            font-size: 1.2rem;
            color: #d35400;
        }

        /* 底部中間 (完成訊息) */
        .footer-center {
            flex-grow: 1;
            text-align: center;
            font-size: 1.5rem;
            color: #58cc02;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 底部右側 (上一題 + 下一題) */
        .footer-right {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            width: 170px; 
        }

        .nav-control-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 5px; 
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 4px 0 var(--primary-shadow);
            font-size: 1rem;
            cursor: pointer;
            visibility: visible; 
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex: 1;
        }
        .nav-control-btn:active { transform: translateY(4px); box-shadow: none; }
        .nav-control-btn:disabled {
            background-color: #ccc;
            box-shadow: none;
            cursor: default;
        }

        /* RWD */
        @media (min-width: 768px) {
            .content-area {
                flex-direction: row;
                align-items: stretch; 
            }
            .info-panel {
                flex: 1;
                max-width: 400px; 
            }
            .matrix-panel {
                flex: 2;
                align-items: center; 
            }
            .syllable-row {
                width: 100%;
                justify-content: center;
            }
            .options-grid {
                grid-template-columns: 1fr 1fr 1fr 1fr;
            }
            .footer-bar {
                padding: 0 20px;
            }
        }
        
        .text-fit-sm { font-size: 1.65rem; }
        .text-fit-md { font-size: 1.95rem; }
        .text-fit-lg { font-size: 2.4rem; }

    </style>

</head>

<div class="md-quiz-link-wrap"><a class="md-quiz-link" href="https://cyril-mingdao.github.io/taigi-quiz/HINGIM-KANGHSUAN-B2L5.html" target="_blank" rel="noopener" title="另開視窗，用學校帳號登入作答並記錄成績">📝 線上測驗</a><span class="md-quiz-link-hint">另開視窗・用學校帳號登入・25 題記錄成績</span></div>

    <script>
        // --- 1. 資料庫 ---
        const db = [
            {id:1, pg:70, ty:"對", tl:"tuì/uì", i1:"t", f1:"uì", t1:"3", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"從(9)"},
            {id:2, pg:70, ty:"今仔日", tl:"kin-á-ji̍t/li̍t", i1:"k", f1:"in", t1:"1", s1:"7", i2:"無", f2:"á", t2:"2", s2:"1", i3:"j", f3:"i̍t", t3:"8", s3:"不變", md:"今天、今日"},
            {id:3, pg:70, ty:"欲", tl:"beh/bueh", i1:"b", f1:"eh", t1:"4", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"表意願；表假設；將要"},
            {id:4, pg:70, ty:"逐工", tl:"ta̍k-kang", i1:"t", f1:"a̍k", t1:"8", s1:"4", i2:"k", f2:"ang", t2:"1", s2:"不變", i3:"", f3:"", t3:"", s3:"", md:"每天"},
            {id:5, pg:70, ty:"呵咾", tl:"o-ló", i1:"無", f1:"o", t1:"1", s1:"7", i2:"l", f2:"ó", t2:"2", s2:"不變", i3:"", f3:"", t3:"", s3:"", md:"讚美、表揚"},
            {id:6, pg:70, ty:"家己", tl:"ka-kī/tī", i1:"k", f1:"a", t1:"1", s1:"7", i2:"k", f2:"ī", t2:"7", s2:"不變", i3:"", f3:"", t3:"", s3:"", md:"自己、本身"},
            {id:7, pg:70, ty:"上", tl:"siōng", i1:"s", f1:"iōng", t1:"7", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"最…；空間位置"},
            {id:8, pg:70, ty:"𠢕", tl:"gâu", i1:"g", f1:"âu", t1:"5", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"能幹；擅某事；易發生"},
            {id:9, pg:70, ty:"媠", tl:"suí", i1:"s", f1:"uí", t1:"2", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"漂亮的、美麗的"},
            {id:10, pg:70, ty:"佮", tl:"kah", i1:"k", f1:"ah", t1:"4", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"和；搭配；附帶；適合"},
            {id:11, pg:70, ty:"仝", tl:"kāng/kâng", i1:"k", f1:"āng", t1:"7", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"相同、無差異"},
            {id:12, pg:70, ty:"親像", tl:"tshin-tshiūnn/tshan", i1:"tsh", f1:"in", t1:"1", s1:"7", i2:"tsh", f2:"iūnn", t2:"7", s2:"不變", i3:"", f3:"", t3:"", s3:"", md:"好像、好比"},
            {id:13, pg:70, ty:"攏", tl:"lóng", i1:"l", f1:"óng", t1:"2", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"都、皆、全部"},
            {id:14, pg:70, ty:"款", tl:"khuán", i1:"kh", f1:"uán", t1:"2", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"種類(5)"},
            {id:15, pg:70, ty:"咱", tl:"lán", i1:"l", f1:"án", t1:"2", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"我們；我們的；您、您們"},
            {id:16, pg:70, ty:"西北雨", tl:"sai-pak-hōo", i1:"s", f1:"ai", t1:"1", s1:"7", i2:"p", f2:"ak", t2:"4", s2:"8", i3:"h", f3:"ōo", t3:"7", s3:"不變", md:"雷陣雨"},
            {id:17, pg:70, ty:"一目𥍉", tl:"tsi̍t-ba̍k-nih", i1:"ts", f1:"i̍t", t1:"8", s1:"4", i2:"b", f2:"a̍k", t2:"8", s2:"4", i3:"n", f3:"ih", t3:"4", s3:"不變", md:"指時間短暫"},
            {id:18, pg:70, ty:"連鞭", tl:"liâm-mi/pinn", i1:"l", f1:"iâm", t1:"5", s1:"7", i2:"m", f2:"i", t2:"1", s2:"不變", i3:"", f3:"", t3:"", s3:"", md:"立刻；即時"},
            {id:19, pg:70, ty:"過去", tl:"kuè--khì/kè--khì", i1:"k", f1:"uè", t1:"3", s1:"不變", i2:"kh", f2:"ì", t2:"3", s2:"輕聲", i3:"", f3:"", t3:"", s3:"", md:"指時限已過/從前"},
            {id:20, pg:70, ty:"紲", tl:"suà", i1:"s", f1:"uà", t1:"3", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"接、續"},
            {id:21, pg:70, ty:"落", tl:"lo̍h", i1:"l", f1:"o̍h", t1:"8", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"下降(11)"},
            {id:22, pg:70, ty:"虹", tl:"khīng", i1:"kh", f1:"īng", t1:"7", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"彩虹"},
            {id:23, pg:70, ty:"色水", tl:"sik-tsuí", i1:"s", f1:"ik", t1:"4", s1:"8", i2:"ts", f2:"uí", t2:"2", s2:"不變", i3:"", f3:"", t3:"", s3:"", md:"顏色"},
            {id:24, pg:70, ty:"無", tl:"bô", i1:"b", f1:"ô", t1:"5", s1:"不變", i2:"", f2:"", t2:"", s2:"", i3:"", f3:"", t3:"", s3:"", md:"修飾形容詞或動詞(7)"},
            {id:25, pg:70, ty:"煩惱", tl:"huân-ló", i1:"h", f1:"uân", t1:"5", s1:"7", i2:"l", f2:"ó", t2:"2", s2:"不變", i3:"", f3:"", t3:"", s3:"", md:"煩悶，不快活"}
        ];

        // --- 2. 狀態變數 ---
        let gameQuestions = [];
        let currentQIndex = 0;
        let selectedQty = 5; 
        
        let questionStates = []; 
        let autoPlayTimer = null; 
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- 3. 遊戲邏輯 ---

        function selectQty(num) {
            selectedQty = num;
            document.querySelectorAll('.qty-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function startGame() {
            const count = selectedQty;
            const shuffledDb = [...db].sort(() => 0.5 - Math.random());
            gameQuestions = shuffledDb.slice(0, count);
            
            questionStates = gameQuestions.map(() => ({
                step: 0,
                answers: {} 
            }));
            
            currentQIndex = 0;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('total-q-num').textContent = count;
            
            loadQuestion(currentQIndex, true);
        }

        function returnToMenu() {
            clearTimeout(autoPlayTimer);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'flex';
        }

        function loadQuestion(index, autoPlay = true) {
            clearTimeout(autoPlayTimer);

            const qData = gameQuestions[index];
            const qState = questionStates[index];
            
            document.getElementById('current-q-num').textContent = index + 1;
            document.getElementById('prev-btn').disabled = (index === 0);
            
            document.getElementById('disp-id').textContent = qData.id;
            document.getElementById('disp-page').textContent = qData.pg;
            document.getElementById('display-taiyu').textContent = qData.ty;

            const mdText = qData.md;
            const mdEl = document.getElementById('display-mandarin');
            mdEl.textContent = mdText;
            
            mdEl.className = 'mandarin-text'; 
            if (mdText.length > 15) {
                mdEl.classList.add('fs-sm'); 
            } else if (mdText.length > 10) {
                mdEl.classList.add('fs-md'); 
            }
            
            // 清除狀態訊息
            document.getElementById('status-msg').textContent = "";
            document.getElementById('options-grid').innerHTML = ""; // 先清空選項

            renderMatrix(qData, qState.answers);
            renderStep(index);

            if (autoPlay) {
                autoPlayTimer = setTimeout(() => {
                    playCurrentAudio();
                }, 800);
            }
        }

        function createTargetBox(id, label, filledVal) {
            const isFilled = filledVal !== undefined;
            const valText = isFilled ? filledVal : '?';
            const filledClass = isFilled ? 'filled' : '';
            return `
                <div class="target-box" id="target-${id}">
                    <div class="target-header">${label}</div>
                    <div class="target-value ${filledClass}" id="val-${id}">${valText}</div>
                </div>
            `;
        }

        function renderMatrix(data, answers) {
            const container = document.getElementById('matrix-container');
            let html = '';

            html += '<div class="syllable-row">';
            html += createTargetBox('i1', '聲母1', answers['i1']);
            html += createTargetBox('f1', '韻母1', answers['f1']);
            html += createTargetBox('t1', '聲調1', answers['t1']);
            html += createTargetBox('s1', '變調1', answers['s1']);
            html += '</div>';

            if (data.i2) {
                html += '<div class="syllable-row">';
                html += createTargetBox('i2', '聲母2', answers['i2']);
                html += createTargetBox('f2', '韻母2', answers['f2']);
                html += createTargetBox('t2', '聲調2', answers['t2']);
                html += createTargetBox('s2', '變調2', answers['s2']);
                html += '</div>';
            }

            if (data.i3) {
                html += '<div class="syllable-row">';
                html += createTargetBox('i3', '聲母3', answers['i3']);
                html += createTargetBox('f3', '韻母3', answers['f3']);
                html += createTargetBox('t3', '聲調3', answers['t3']);
                html += createTargetBox('s3', '變調3', answers['s3']);
                html += '</div>';
            }

            container.innerHTML = html;
        }

        function getStepsForQuestion(data) {
            let steps = [];
            steps.push({key: 'i1', ref: 'init1'});
            steps.push({key: 'f1', ref: 'fin1'});
            steps.push({key: 't1', ref: 'tone1'});
            steps.push({key: 's1', ref: 'sandhi1'});
            
            if (data.i2) {
                steps.push({key: 'i2', ref: 'init2'});
                steps.push({key: 'f2', ref: 'fin2'});
                steps.push({key: 't2', ref: 'tone2'});
                steps.push({key: 's2', ref: 'sandhi2'});
            }
            if (data.i3) {
                steps.push({key: 'i3', ref: 'init3'});
                steps.push({key: 'f3', ref: 'fin3'});
                steps.push({key: 't3', ref: 'tone3'});
                steps.push({key: 's3', ref: 'sandhi3'});
            }
            return steps;
        }

        function renderStep(qIdx) {
            const qData = gameQuestions[qIdx];
            const qState = questionStates[qIdx];
            const steps = getStepsForQuestion(qData);
            
            document.querySelectorAll('.target-box').forEach(el => el.classList.remove('active-step'));

            if (qState.step >= steps.length) {
                document.getElementById('status-msg').textContent = "";
                document.getElementById('options-grid').innerHTML = "";
                return;
            }

            // 未完成：清空底部訊息
            document.getElementById('status-msg').textContent = "";

            const step = steps[qState.step];
            const correctAns = qData[step.key];
            
            const targetEl = document.getElementById(`target-${step.key}`);
            if(targetEl) targetEl.classList.add('active-step');

            const options = generateOptions(step.key, correctAns);
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            const labels = ['A', 'B', 'C', 'D'];

            options.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option-card';
                
                const idxBox = document.createElement('div');
                idxBox.className = 'opt-idx-box';
                idxBox.textContent = labels[idx];
                
                const txt = document.createElement('span');
                txt.className = 'opt-text';
                txt.textContent = opt;
                if (opt.length > 8) txt.classList.add('text-fit-sm');
                else if (opt.length > 4) txt.classList.add('text-fit-md');
                else txt.classList.add('text-fit-lg');

                btn.appendChild(idxBox);
                btn.appendChild(txt);

                btn.onclick = () => checkAnswer(btn, opt, correctAns, step.key, qIdx);
                grid.appendChild(btn);
            });
        }

        // 修改：允許同類型的資料（如聲母1、2、3）互相作為選項
        function generateOptions(key, correct) {
            // 判斷當前題目的類型 (i=聲母, f=韻母, t=聲調, s=變調)
            const prefix = key.charAt(0); 
            // 找出該類型所有的欄位 (1, 2, 3)
            const targetCols = [prefix + '1', prefix + '2', prefix + '3'];

            const allValues = new Set();
            db.forEach(item => {
                // 遍歷所有欄位，將同類型的資料都加入候選名單
                targetCols.forEach(col => {
                    if (item[col] !== undefined && item[col] !== "") {
                        allValues.add(item[col]);
                    }
                });
            });
            
            allValues.delete(correct);
            
            let dist = Array.from(allValues);
            const selections = [];
            
            while(selections.length < 3) {
                if (dist.length === 0) {
                    dist = Array.from(allValues);
                    if (dist.length === 0) break; 
                }
                
                const r = Math.floor(Math.random() * dist.length);
                selections.push(dist[r]);
                dist.splice(r, 1);
            }
            
            selections.push(correct);
            
            while(selections.length < 4) {
                 selections.push("-"); 
            }

            return selections.sort(() => 0.5 - Math.random());
        }

        function checkAnswer(btn, selected, correct, cellKey, qIdx) {
            if (qIdx !== currentQIndex) return; 
            if (btn.classList.contains('correct') || document.querySelector('.option-card.correct')) return;

            if (selected === correct) {
                btn.classList.add('correct');
                playBeep('correct');
                
                const valDiv = document.getElementById(`val-${cellKey}`);
                if(valDiv) {
                    valDiv.textContent = correct;
                    valDiv.classList.add('filled');
                }

                questionStates[qIdx].answers[cellKey] = correct;
                
                setTimeout(() => {
                    questionStates[qIdx].step++;
                    renderStep(qIdx);
                }, 600);
            } else {
                btn.classList.add('wrong');
                playBeep('wrong');
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--;
                loadQuestion(currentQIndex, false);
            }
        }

        function nextQuestion() {
            if (currentQIndex < gameQuestions.length - 1) {
                currentQIndex++;
                loadQuestion(currentQIndex, true);
            } else {
                returnToMenu();
            }
        }

            const first = s.split('/')[0].trim();
            if (!n || cnt(tok) === n) return tok;
            if (cnt(first) === n) return first;
            return tok;
        }
