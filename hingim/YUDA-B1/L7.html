        // --- 2. 狀態變數 ---
        let gameQuestions = [];
        let currentQIndex = 0;
        let selectedQty = 5; 
        
        let questionStates = []; 
        let autoPlayTimer = null; 
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- 3. 遊戲邏輯 ---

        function selectQty(num) {
            selectedQty = num;
            document.querySelectorAll('.qty-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function startGame() {
            const count = selectedQty;
            const shuffledDb = [...db].sort(() => 0.5 - Math.random());
            gameQuestions = shuffledDb.slice(0, count);
            
            questionStates = gameQuestions.map(() => ({
                step: 0,
                answers: {} 
            }));
            
            currentQIndex = 0;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('total-q-num').textContent = count;
            
            loadQuestion(currentQIndex, true);
        }

        function returnToMenu() {
            clearTimeout(autoPlayTimer);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'flex';
        }

        function loadQuestion(index, autoPlay = true) {
            clearTimeout(autoPlayTimer);

            const qData = gameQuestions[index];
            const qState = questionStates[index];
            
            document.getElementById('current-q-num').textContent = index + 1;
            document.getElementById('prev-btn').disabled = (index === 0);
            
            document.getElementById('disp-id').textContent = qData.id;
            document.getElementById('disp-page').textContent = qData.pg;
            document.getElementById('display-taiyu').textContent = qData.ty;

            const mdText = qData.md;
            const mdEl = document.getElementById('display-mandarin');
            mdEl.textContent = mdText;
            
            mdEl.className = 'mandarin-text'; 
            if (mdText.length > 15) {
                mdEl.classList.add('fs-sm'); 
            } else if (mdText.length > 10) {
                mdEl.classList.add('fs-md'); 
            }
            
            // 清除狀態訊息
            document.getElementById('status-msg').textContent = "";
            document.getElementById('options-grid').innerHTML = ""; // 先清空選項

            renderMatrix(qData, qState.answers);
            renderStep(index);

            if (autoPlay) {
                autoPlayTimer = setTimeout(() => {
                    playCurrentAudio();
                }, 800);
            }
        }

            const isFilled = filledVal !== undefined;
            const valText = isFilled ? filledVal : '?';

                <div class="target-box" id="target-${id}">
                    <div class="target-header">${label}</div>
                    <div class="target-value ${filledClass}" id="val-${id}">${valText}</div>

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            const labels = ['A', 'B', 'C', 'D'];

            options.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option-card';
                
                const idxBox = document.createElement('div');
                idxBox.className = 'opt-idx-box';
                idxBox.textContent = labels[idx];
                
                const txt = document.createElement('span');
                txt.className = 'opt-text';
                txt.textContent = opt;
                if (opt.length > 8) txt.classList.add('text-fit-sm');
                else if (opt.length > 4) txt.classList.add('text-fit-md');
                else txt.classList.add('text-fit-lg');

                btn.appendChild(idxBox);
                btn.appendChild(txt);

                btn.onclick = () => checkAnswer(btn, opt, correctAns, step.key, qIdx);
                grid.appendChild(btn);
            });
        }

        // 修改：允許同類型的資料（如聲母1、2、3、4、5）互相作為選項
        function generateOptions(key, correct) {
            // 判斷當前題目的類型 (i=聲母, f=韻母, t=聲調, s=變調)
            const prefix = key.charAt(0); 
            // 找出該類型所有的欄位 (1, 2, 3, 4, 5)
            const targetCols = [prefix + '1', prefix + '2', prefix + '3', prefix + '4', prefix + '5'];

            const allValues = new Set();
            db.forEach(item => {
                // 遍歷所有欄位，將同類型的資料都加入候選名單
                targetCols.forEach(col => {
                    if (item[col] !== undefined && item[col] !== "") {
                        allValues.add(item[col]);
                    }
                });
            });
            
            allValues.delete(correct);
            
            let dist = Array.from(allValues);
            const selections = [];
            
            while(selections.length < 3) {
                if (dist.length === 0) {
                    dist = Array.from(allValues);
                    if (dist.length === 0) break; 
                }
                
                const r = Math.floor(Math.random() * dist.length);
                selections.push(dist[r]);
                dist.splice(r, 1);
            }
            
            selections.push(correct);
            
            while(selections.length < 4) {
                 selections.push("-"); 
            }

            return selections.sort(() => 0.5 - Math.random());
        }

        function checkAnswer(btn, selected, correct, cellKey, qIdx) {
            if (qIdx !== currentQIndex) return; 
            if (btn.classList.contains('correct') || document.querySelector('.option-card.correct')) return;

            if (selected === correct) {
                btn.classList.add('correct');
                playBeep('correct');
                
                const valDiv = document.getElementById(`val-${cellKey}`);
                if(valDiv) {
                    valDiv.textContent = correct;
                    valDiv.classList.add('filled');
                }

                questionStates[qIdx].answers[cellKey] = correct;
                
                setTimeout(() => {
                    questionStates[qIdx].step++;
                    renderStep(qIdx);
                }, 600);
            } else {
                btn.classList.add('wrong');
                playBeep('wrong');
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--;
                loadQuestion(currentQIndex, false);
            }
        }

        function nextQuestion() {
            if (currentQIndex < gameQuestions.length - 1) {
                currentQIndex++;
                loadQuestion(currentQIndex, true);
            } else {
                returnToMenu();
            }
        }

        function playCurrentAudio() {
            const data = gameQuestions[currentQIndex];
            if (!data) return;
            const raw = data.tl;
            const processed = raw.split(' ').map(s => s.split('/')[0]).join(' ');
            try {
                const dummy = document.createElement('div');
                holo(dummy, processed);
            } catch (e) {
                console.error("Audio error:", e);
            }
        }
    </script>
