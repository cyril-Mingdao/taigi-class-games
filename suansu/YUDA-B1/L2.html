        // 遊戲狀態
        let gameMode = null;
        let questionCount = null;
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let selectedAnswer = null;

        // 音效創建函數
        function createAudioContext() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            return audioContext;
        }

        function playCorrectSound() {
            try {
                const audioContext = createAudioContext();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
                oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // G5
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        function playIncorrectSound() {
            try {
                const audioContext = createAudioContext();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(220, audioContext.currentTime); // A3
                oscillator.frequency.setValueAtTime(196, audioContext.currentTime + 0.15); // G3
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.4);
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        // 選單功能
        function selectGameMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.menu-button').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(mode === 'taiwanese' ? 'mode1' : 'mode2').classList.add('selected');
            updateStartButton();
        }

        function selectQuestionCount(count) {
            questionCount = count;
            document.querySelectorAll('.menu-button').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(`count${count}`).classList.add('selected');
            updateStartButton();
        }

        function updateStartButton() {
            const startButton = document.getElementById('startButton');
            if (gameMode && questionCount) {
                startButton.disabled = false;
            } else {
                startButton.disabled = true;
            }
        }

        function startGame() {
            if (!gameMode || !questionCount) return;
            
            // 隨機選擇題目
            const shuffled = [...questionDatabase].sort(() => 0.5 - Math.random());
            currentQuestions = shuffled.slice(0, questionCount);
            currentQuestionIndex = 0;
            userAnswers = new Array(questionCount).fill(null);
            
            // 切換到遊戲畫面
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            const question = currentQuestions[currentQuestionIndex];
            const correctAnswer = gameMode === 'taiwanese' ? question.taiwanese : question.romanization;
            
            // 更新題目資訊
            document.getElementById('currentItem').textContent = question.item;
            document.getElementById('currentPage').textContent = question.page;
            document.getElementById('chineseTranslation').textContent = question.chinese;
            document.getElementById('questionCounter').textContent = `${currentQuestionIndex + 1}/${questionCount}`;
            
            // 更新進度條
            const progress = ((currentQuestionIndex + 1) / questionCount) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
            
            // 創建選項
            const options = [correctAnswer];
            const otherQuestions = questionDatabase.filter(q => q !== question);
            
            // 隨機選擇3個錯誤選項
            while (options.length < 4) {
                const randomQuestion = otherQuestions[Math.floor(Math.random() * otherQuestions.length)];
                const wrongAnswer = gameMode === 'taiwanese' ? randomQuestion.taiwanese : randomQuestion.romanization;
                if (!options.includes(wrongAnswer)) {
                    options.push(wrongAnswer);
                }
            }
            
            // 打亂選項順序
            const shuffledOptions = options.sort(() => 0.5 - Math.random());
            
            // 根據遊戲模式更新題目文字
            let questionText;
            if (gameMode === 'taiwanese') {
                // 台語語詞模式：在例句中挖空台語詞
                questionText = question.sentence.replace(correctAnswer, '<span class="blank">______</span>');
            } else {
                // 台羅拼音模式：在例句中將台語詞用下底線呈現
                questionText = question.sentence.replace(question.taiwanese, '<span class="blank">______</span>');
            }
            document.getElementById('questionText').innerHTML = questionText;
            
            // 更新選項按鈕
            shuffledOptions.forEach((option, index) => {
                const button = document.getElementById(`option${index}`);
                const textElement = document.getElementById(`optionText${index}`);
                textElement.textContent = option;
                
                // 重置按鈕狀態
                button.className = 'option-button';
                button.disabled = false;
                
                // 調整字體大小
                adjustFontSize(textElement, option);
            });
            
            // 重置選擇狀態
            selectedAnswer = null;
            updateNavigationButtons();
        }

        function adjustFontSize(element, text) {
            // 根據文字長度和複雜度調整字體大小
            let fontSize = 1.8; // 基礎字體大小 (rem)
            
            // 根據螢幕寬度調整基礎大小
            const screenWidth = window.innerWidth;
            if (screenWidth <= 480) {
                fontSize = 1.8; // 小螢幕 - 單欄排列有更多空間
            } else if (screenWidth <= 768) {
                fontSize = 1.9; // 中等螢幕 - 單欄排列有更多空間
            }
            
            // 根據文字長度調整
            if (text.length > 15) {
                fontSize *= 0.85; // 長文字縮小
            } else if (text.length > 10) {
                fontSize *= 0.92; // 中等長度文字稍微縮小
            }
            
            // 檢查是否包含複雜字符（羅馬拼音符號）
            if (/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(text) || text.includes('/')) {
                fontSize *= 0.92;
            }
            
            element.style.fontSize = `${fontSize}rem`;
        }

        function selectAnswer(optionIndex) {
            const question = currentQuestions[currentQuestionIndex];
            const correctAnswer = gameMode === 'taiwanese' ? question.taiwanese : question.romanization;
            const selectedText = document.getElementById(`optionText${optionIndex}`).textContent;
            const button = document.getElementById(`option${optionIndex}`);
            
            // 如果選擇正確答案
            if (selectedText === correctAnswer) {
                selectedAnswer = optionIndex;
                userAnswers[currentQuestionIndex] = selectedText;
                
                // 標記正確答案並禁用所有選項
                for (let i = 0; i < 4; i++) {
                    const btn = document.getElementById(`option${i}`);
                    const text = document.getElementById(`optionText${i}`).textContent;
                    btn.disabled = true;
                    
                    if (text === correctAnswer) {
                        btn.classList.add('correct');
                    }
                }
                
                playCorrectSound();
                updateNavigationButtons();
            } else {
                // 選擇錯誤答案，只標記這個選項為錯誤，但不禁用其他選項
                button.classList.add('incorrect');
                button.disabled = true;
                playIncorrectSound();
            }
        }

        function updateNavigationButtons() {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            
            prevButton.disabled = currentQuestionIndex === 0;
            nextButton.disabled = currentQuestionIndex === questionCount - 1;
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
                
                // 如果這題已經回答過，顯示之前的答案狀態
                if (userAnswers[currentQuestionIndex] !== null) {
                    showPreviousAnswer();
                }
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questionCount - 1) {
                currentQuestionIndex++;
                loadQuestion();
                
                // 如果這題已經回答過，顯示之前的答案狀態
                if (userAnswers[currentQuestionIndex] !== null) {
                    showPreviousAnswer();
                }
            }
        }

        function showPreviousAnswer() {
            const question = currentQuestions[currentQuestionIndex];
            const correctAnswer = gameMode === 'taiwanese' ? question.taiwanese : question.romanization;
            const userAnswer = userAnswers[currentQuestionIndex];
            
            // 找到用戶選擇的選項
            for (let i = 0; i < 4; i++) {
                const button = document.getElementById(`option${i}`);
                const text = document.getElementById(`optionText${i}`).textContent;
                button.disabled = true;
                
                if (text === correctAnswer) {
                    button.classList.add('correct');
                } else if (text === userAnswer) {
                    button.classList.add('incorrect');
                    selectedAnswer = i;
                }
            }
        }

        function backToMenu() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('menuScreen').classList.remove('hidden');
            
            // 重置遊戲狀態
            gameMode = null;
            questionCount = null;
            document.querySelectorAll('.menu-button').forEach(btn => btn.classList.remove('selected'));
            updateStartButton();
        }

        // 防止右鍵和文字選取
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        // 鍵盤快捷鍵
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('gameScreen').classList.contains('hidden')) return;
            
            if (e.key >= '1' && e.key <= '4') {
                const optionIndex = parseInt(e.key) - 1;
                if (selectedAnswer === null) {
                    selectAnswer(optionIndex);
                }
            } else if (e.key === 'ArrowLeft') {
                previousQuestion();
            } else if (e.key === 'ArrowRight') {
                nextQuestion();
            }
        });

        // 監聽螢幕尺寸變化，重新調整字體大小
        window.addEventListener('resize', function() {
            if (!document.getElementById('gameScreen').classList.contains('hidden')) {
                // 重新調整當前題目的選項字體大小
                for (let i = 0; i < 4; i++) {
                    const textElement = document.getElementById(`optionText${i}`);
                    if (textElement && textElement.textContent) {
                        adjustFontSize(textElement, textElement.textContent);
                    }
                }
            }
        });

        // Element SDK 配置
        const defaultConfig = {
            main_title: "選詞塌空",
            sub_title: "第2課 茂林的Rukai族佮烏秫米祭"
        };

        async function onConfigChange(config) {
            document.getElementById('mainTitle').textContent = config.main_title || defaultConfig.main_title;
            document.getElementById('subTitle').textContent = config.sub_title || defaultConfig.sub_title;
        }

        function mapToCapabilities(config) {
            return {
                recolorables: [],
                borderables: [],
                fontEditable: undefined,
                fontSizeable: undefined
            };
        }

        function mapToEditPanelValues(config) {
            return new Map([
                ["main_title", config.main_title || defaultConfig.main_title],
                ["sub_title", config.sub_title || defaultConfig.sub_title]
            ]);
        }

        // 初始化 Element SDK
        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities,
                mapToEditPanelValues
            });
        }
