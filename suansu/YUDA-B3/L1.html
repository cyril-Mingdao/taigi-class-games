            if (gameMode === 'taiwanese') {
                // 台語語詞模式：在例句中挖空台語詞
                questionText = question.sentence.replace(correctAnswer, '<span class="blank">______</span>');
            } else {
                // 台羅拼音模式：在例句中將台語詞用下底線呈現
                questionText = question.sentence.replace(question.taiwanese, '<span class="blank">______</span>');
            }
            document.getElementById('questionText').innerHTML = questionText;
            
            // 更新選項按鈕
            shuffledOptions.forEach((option, index) => {
                const button = document.getElementById(`option${index}`);
                const textElement = document.getElementById(`optionText${index}`);
                textElement.textContent = option;
                
                // 重置按鈕狀態
                button.className = 'option-button';
                button.disabled = false;
                
                // 調整字體大小
                adjustFontSize(textElement, option);
            });
            
            // 重置選擇狀態
            selectedAnswer = null;
            updateNavigationButtons();
        }

        function adjustFontSize(element, text) {
            // 根據文字長度和複雜度調整字體大小
            let fontSize = 1.8; // 基礎字體大小 (rem)
            
            // 根據螢幕寬度調整基礎大小
            const screenWidth = window.innerWidth;
            if (screenWidth <= 480) {
                fontSize = 1.8; // 小螢幕 - 單欄排列有更多空間
            } else if (screenWidth <= 768) {
                fontSize = 1.9; // 中等螢幕 - 單欄排列有更多空間
            }
            
            // 根據文字長度調整
            if (text.length > 15) {
                fontSize *= 0.85; // 長文字縮小
            } else if (text.length > 10) {
                fontSize *= 0.92; // 中等長度文字稍微縮小
            }
            
            // 檢查是否包含複雜字符（羅馬拼音符號）
            if (/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(text) || text.includes('/')) {
                fontSize *= 0.92;
            }
            
            element.style.fontSize = `${fontSize}rem`;
        }

        function selectAnswer(optionIndex) {
            const question = currentQuestions[currentQuestionIndex];
            const correctAnswer = gameMode === 'taiwanese' ? question.taiwanese : question.romanization;
            const selectedText = document.getElementById(`optionText${optionIndex}`).textContent;
            const button = document.getElementById(`option${optionIndex}`);
            
            // 如果選擇正確答案
            if (selectedText === correctAnswer) {
                selectedAnswer = optionIndex;
                userAnswers[currentQuestionIndex] = selectedText;
                
                // 標記正確答案並禁用所有選項
                for (let i = 0; i < 4; i++) {
                    const btn = document.getElementById(`option${i}`);
                    const text = document.getElementById(`optionText${i}`).textContent;
                    btn.disabled = true;
                    
                    if (text === correctAnswer) {
                        btn.classList.add('correct');
                    }
                }
                
                playCorrectSound();
                updateNavigationButtons();
            } else {
                // 選擇錯誤答案，只標記這個選項為錯誤，但不禁用其他選項
                button.classList.add('incorrect');
                button.disabled = true;
                playIncorrectSound();
            }
        }

        function updateNavigationButtons() {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            
            prevButton.disabled = currentQuestionIndex === 0;
            nextButton.disabled = currentQuestionIndex === questionCount - 1;
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
                
                // 如果這題已經回答過，顯示之前的答案狀態
                if (userAnswers[currentQuestionIndex] !== null) {
                    showPreviousAnswer();
                }
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questionCount - 1) {
                currentQuestionIndex++;
                loadQuestion();
                
                // 如果這題已經回答過，顯示之前的答案狀態
                if (userAnswers[currentQuestionIndex] !== null) {
                    showPreviousAnswer();
                }
            }
        }

        function showPreviousAnswer() {
            const question = currentQuestions[currentQuestionIndex];
            const correctAnswer = gameMode === 'taiwanese' ? question.taiwanese : question.romanization;
            const userAnswer = userAnswers[currentQuestionIndex];
            
            // 找到用戶選擇的選項
            for (let i = 0; i < 4; i++) {
                const button = document.getElementById(`option${i}`);
                const text = document.getElementById(`optionText${i}`).textContent;
                button.disabled = true;
                
                if (text === correctAnswer) {
                    button.classList.add('correct');
                } else if (text === userAnswer) {
                    button.classList.add('incorrect');
                    selectedAnswer = i;
                }
            }
        }

        function backToMenu() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('menuScreen').classList.remove('hidden');
            
            // 重置遊戲狀態
            gameMode = null;
            questionCount = null;
            document.querySelectorAll('.menu-button').forEach(btn => btn.classList.remove('selected'));
            updateStartButton();
        }

        // 防止右鍵和文字選取
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        // 鍵盤快捷鍵
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('gameScreen').classList.contains('hidden')) return;
            
            if (e.key >= '1' && e.key <= '4') {
                const optionIndex = parseInt(e.key) - 1;
                if (selectedAnswer === null) {
                    selectAnswer(optionIndex);
                }
            } else if (e.key === 'ArrowLeft') {
                previousQuestion();
            } else if (e.key === 'ArrowRight') {
                nextQuestion();
            }
        });

        // 監聽螢幕尺寸變化，重新調整字體大小
        window.addEventListener('resize', function() {
            if (!document.getElementById('gameScreen').classList.contains('hidden')) {
                // 重新調整當前題目的選項字體大小
                for (let i = 0; i < 4; i++) {
                    const textElement = document.getElementById(`optionText${i}`);
                    if (textElement && textElement.textContent) {
                        adjustFontSize(textElement, textElement.textContent);
                    }
                }
            }
        });

        // Element SDK 配置
        const defaultConfig = {
            main_title: "選詞塌空",
            sub_title: "第1課 白糖粿"
        };

        async function onConfigChange(config) {
            document.getElementById('mainTitle').textContent = config.main_title || defaultConfig.main_title;
            document.getElementById('subTitle').textContent = config.sub_title || defaultConfig.sub_title;
        }

        function mapToCapabilities(config) {
            return {
                recolorables: [],
                borderables: [],
                fontEditable: undefined,
                fontSizeable: undefined
            };
        }

        function mapToEditPanelValues(config) {
            return new Map([
                ["main_title", config.main_title || defaultConfig.main_title],
                ["sub_title", config.sub_title || defaultConfig.sub_title]
            ]);
        }

        // 初始化 Element SDK
        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities,
                mapToEditPanelValues
            });
        }
    </script>

#g3 .g3-txt{display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left;white-space:nowrap}
#g3 .g3-txt small{font-size:.58em;font-weight:700;opacity:.65;margin-top:.25em}
/* 開始鈕 */
html body #g3 .g3-start{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-height:clamp(54px,13vh,130px);padding:.4em .6em;border-radius:16px;background:var(--y)!important;color:var(--k)!important;border:3px solid var(--y)!important;font-family:tauhu-oo,"Noto Sans TC","Microsoft JhengHei",sans-serif;font-weight:900;font-size:clamp(18px,min(2.4vw,5vh),44px);line-height:1.2;letter-spacing:.06em;transition:transform .12s,background .12s;box-shadow:0 6px 0 #b39500!important;opacity:1!important}
html body #g3 .g3-start:not(:disabled):hover,html body #g3 .g3-start:not(:disabled):focus-visible{transform:translateY(-2px);outline:none;background:#ffe14d!important}
html body #g3 .g3-start:not(:disabled):active{transform:translateY(4px);box-shadow:0 2px 0 #b39500!important}
html body #g3 .g3-start:disabled{cursor:not-allowed;background:transparent!important;color:#888!important;border:3px dashed #555!important;box-shadow:none!important;font-size:clamp(14px,min(1.6vw,3.4vh),28px);letter-spacing:.02em}
/* 線上測驗 */
html body #g3 .md-quiz-link-wrap{all:unset;display:block}
html body #g3 a.md-quiz-link{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:.6em;width:100%;padding:clamp(8px,1.6vh,16px) clamp(10px,1vw,16px);border-radius:14px;background:var(--k);color:var(--y);border:3px solid var(--y);font-family:tauhu-oo,"Noto Sans TC","Microsoft JhengHei",sans-serif;font-weight:900;font-size:clamp(14px,min(1.6vw,3.2vh),26px);line-height:1.2;transition:background .12s,color .12s,transform .12s}
html body #g3 a.md-quiz-link:hover,html body #g3 a.md-quiz-link:focus-visible{background:var(--y);color:var(--k);transform:translateY(-2px);outline:none}
html body #g3 a.md-quiz-link .g3-sub{display:block;text-wrap:balance;font-size:.6em;font-weight:500;opacity:.8;margin-top:.2em}
html body #g3 .md-quiz-link-hint{display:none}
/* 矮螢幕橫放（手機橫拿） */
@media (orientation:landscape) and (max-height:520px){
 #g3 .g3-head{padding-top:4px;padding-bottom:4px;border-bottom-width:3px}
 #g3 .g3-body{padding:8px 12px 24px;gap:10px}
 #g3 .g3-main{gap:8px}
 #g3 .g3-step{padding:6px 10px;gap:6px;border-radius:12px}
 #g3 .g3-side{padding:8px 10px;gap:6px;border-radius:12px}
 #g3 .g3-sum{padding:.4em .7em;font-size:12px}
 #g3 .g3-sep,#g3 .g3-txt small,html body #g3 a.md-quiz-link .g3-sub{display:none}
 html body #g3 .g3-grp>button,html body #g3 .g3-grp>.qty-btn{border-radius:10px;border-width:2px}
 html body #g3 .g3-start{min-height:44px;border-radius:12px;box-shadow:0 3px 0 #b39500}
 html body #g3 a.md-quiz-link{padding:6px 10px;border-width:2px;border-radius:12px}
}
/* 直放（手機） */
@media (orientation:portrait){
 html body.g3-menu #g3{overflow-y:auto}
 #g3 .g3-head{flex-wrap:wrap;padding-right:64px;row-gap:6px}
 html body #g3 .g3-title{white-space:normal;font-size:clamp(20px,6vw,40px);flex-basis:100%;order:3}
 #g3 .g3-body{flex:none;flex-direction:column;padding:12px 14px 44px}
 #g3 .g3-main{flex:none}
 #g3 .g3-step{flex:none}
 #g3 .g3-side{flex:none;overflow:visible}
 #g3 .g3-gap{display:none}
 html body #g3 .g3-grp,html body #g3 .g3-main.g3-one .g3-grp{flex:none;max-height:none;height:auto}
 html body #g3 .g3-grp.g3-mode,html body #g3 .g3-grp.g3-mode.g3-m4{grid-template-columns:1fr!important;max-height:none}
 html body #g3 .g3-grp.g3-mode>*{min-height:clamp(52px,8vh,80px);font-size:clamp(17px,5vw,30px)}
 html body #g3 .g3-grp.g3-cnt{grid-template-columns:repeat(3,1fr)!important}
 html body #g3 .g3-grp.g3-cnt>.g3-all{grid-column:span var(--g3span,1)}
 html body #g3 .g3-grp.g3-cnt>*{min-height:clamp(52px,8vh,80px);font-size:clamp(20px,6.4vw,36px)}
 html body #g3 .g3-grp.g3-cnt>.g3-all{font-size:clamp(17px,5vw,30px)}
 #g3 .g3-h{font-size:clamp(16px,4.6vw,24px)}
 #g3 .g3-sum{font-size:clamp(14px,4vw,20px)}
 html body #g3 .g3-start{font-size:clamp(20px,6vw,32px);min-height:64px}
 html body #g3 .g3-start:disabled{font-size:clamp(16px,4.4vw,24px)}
 html body #g3 a.md-quiz-link{font-size:clamp(17px,4.8vw,24px)}
}
@media (orientation:portrait) and (min-width:600px){
 html body #g3 .g3-grp.g3-mode,html body #g3 .g3-grp.g3-mode.g3-m4{grid-template-columns:repeat(2,1fr)!important}
}
</style>
<script id="md-gmenu3-js">
(function(){
 var d=document;if(d.getElementById('g3'))return;
 var menu=['menu-screen','menuContainer','menuScreen','menu-page'].map(function(i){return d.getElementById(i);}).filter(Boolean)[0];
 if(!menu)return;
 var byClass=menu.id==='menuScreen'||menu.id==='menu-page';
 function isMenu(){return byClass?!menu.classList.contains('hidden'):menu.style.display!=='none';}
 function txt(sel){var e=menu.querySelector(sel);return e?e.textContent.replace(/\s+/g,' ').trim():'';}
 var game=txt('h1,.menu-main-title,.title')||'課堂遊戲';
 var sub=txt('h2,.menu-sub-title,.subtitle');var m=sub.match(/第\s*\d.*$/);if(m)sub=m[0];
 /* 冊別（由網址代號判斷） */
 var book='',pm=location.pathname.match(/\/(CHINPING|KANGHSUAN|CHUANHWA|YUDA)-B(\d+)\//);
 if(pm){var B={'YUDA-B1':'育達全1冊','YUDA-B2':'育達創世紀全1冊'},P={CHINPING:'真平',KANGHSUAN:'康軒',CHUANHWA:'全華',YUDA:'育達'};book=B[pm[1]+'-B'+pm[2]]||(P[pm[1]]+'第'+pm[2]+'冊');}
 /* 找原本元件 */
 var cntGrp=menu.querySelector('.qty-grid,.question-count-grid,#count-selection');
 if(!cntGrp){var b5=menu.querySelector('#count5');cntGrp=b5&&b5.parentElement;}
 var modeGrp=menu.querySelector('.game-mode-grid,#mode-selection');
 if(!modeGrp){var m1=menu.querySelector('#mode1');modeGrp=m1&&m1.parentElement;}
 var start=menu.querySelector('.btn-start,#startGameButton,#startButton,#start-game');
 var quiz=menu.querySelector('.md-quiz-link-wrap');
 if(!cntGrp||!start)return;
 /* 版面 */
 var g=d.createElement('div');g.id='g3';g.setAttribute('role','main');
 g.innerHTML='<header class="g3-head"><span class="g3-tag"></span><div class="g3-title"></div>'+(book?'<span class="g3-book"></span>':'')+'</header>'+
  '<div class="g3-body"><section class="g3-main"></section><aside class="g3-side"></aside></div>';
 g.querySelector('.g3-tag').textContent=game;g.querySelector('.g3-title').textContent=sub;
 if(book)g.querySelector('.g3-book').textContent=book;
 var main=g.querySelector('.g3-main'),side=g.querySelector('.g3-side'),n=0;
 function step(title,grp,cls){var s=d.createElement('div');s.className='g3-step';s.innerHTML='<div class="g3-h"><b>'+(++n)+'</b>'+title+'</div>';
  grp.classList.add('g3-grp',cls);s.appendChild(grp);main.appendChild(s);}
 var SVG={ear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-7h3zM3 19a2 2 0 0 0 2 2h1v-7H3z"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>'};
 var modeNames=[],fitModes=null;
 if(modeGrp){
  [].slice.call(modeGrp.children).forEach(function(b){
   var t=b.textContent.replace(/[🎧👀]/g,'').replace(/\s+/g,'').trim(),ico,small='';
   if(/^聽/.test(t))ico=SVG.ear;else if(/^看/.test(t))ico=SVG.eye;
   else if(/台羅|臺羅/.test(t)){ico='Lô';small=game.indexOf('鬥句')>=0?'用台羅拼音鬥句':'選項用台羅拼音';}
   else {ico='漢';small=game.indexOf('鬥句')>=0?'用台語漢字鬥句':'選項用台語漢字';}
   b.innerHTML='<span class="g3-ico">'+ico+'</span><span class="g3-txt">'+t+(small?'<small>'+small+'</small>':'')+'</span>';
   b.setAttribute('data-g3', t);
  });
  modeGrp.style.gridTemplateColumns='repeat('+Math.min(modeGrp.children.length,3)+',1fr)';
  if(modeGrp.children.length>=4)modeGrp.classList.add('g3-m4');
  /* 方式鈕文字不斷行：放不下就自動縮小字級（老師 2026-11-23） */
  fitModes=function(){if(!d.body.classList.contains('g3-menu'))return;[].slice.call(modeGrp.children).forEach(function(b){
   var t=b.querySelector('.g3-txt');if(!t)return;b.style.fontSize='';var fs=parseFloat(getComputedStyle(b).fontSize),i=0;
   while(t.scrollWidth>t.clientWidth+1&&i<40&&fs>9){fs*=0.95;b.style.fontSize=fs+'px';i++;}});};
  window.addEventListener('resize',function(){requestAnimationFrame(fitModes);});
  if(window.ResizeObserver)new ResizeObserver(function(){requestAnimationFrame(fitModes);}).observe(modeGrp);
  if(d.fonts&&d.fonts.ready)d.fonts.ready.then(fitModes);
  step('選擇遊戲方式',modeGrp,'g3-mode');
 }
 var cnts=[].slice.call(cntGrp.children).filter(function(b){return b.matches('button,.qty-btn');});
 /* 題庫不多於題數時隱藏該題數鈕（用「全部」即可） */
 var bank=0;try{bank=(typeof db!=='undefined'&&db.length)||(typeof gameData!=='undefined'&&gameData.length)||(typeof questionDatabase!=='undefined'&&questionDatabase.length)||(typeof FULL_GAME_DATA!=='undefined'&&FULL_GAME_DATA.length)||0;}catch(_){}
 cnts.forEach(function(b){var k=b.textContent.match(/\d+/);if(bank&&k&&b.id!=='md-all-btn'&&+k[0]>=bank&&+k[0]!==5){b.hidden=true;b.classList.remove('selected');}});
 cnts=cnts.filter(function(b){return !b.hidden;});
 cnts.forEach(function(b){var k=b.textContent.match(/\d+/);if(k&&b.id!=='md-all-btn'){b.textContent=k[0];b.classList.add('g3-n');b.setAttribute('aria-label',k[0]+'題');}else b.classList.add('g3-all');});
 cntGrp.style.gridTemplateColumns='repeat('+cnts.length+',1fr)';
 var al=cntGrp.querySelector('.g3-all');if(al)al.style.setProperty('--g3span',3-(cnts.length-1)%3);
 step('選擇題數',cntGrp,'g3-cnt');
 if(!modeGrp)main.classList.add('g3-one');
 /* 右側面板 */
 side.innerHTML='<div class="g3-h"><b>'+(++n)+'</b>開始練習</div><div class="g3-sum">'+(modeGrp?'<div><span>方式</span><strong class="g3-sm"></strong></div>':'')+'<div><span>題數</span><strong class="g3-sc"></strong></div></div>';
 start.classList.add('g3-start');side.appendChild(start);
 /* 開始鈕文字統一「開始遊戲」（老師 2026-11-23；鬥句原本會被程式改成「開始 N 題測驗」） */
 function lab(){if(start.textContent!=='開始遊戲')start.textContent='開始遊戲';}
 lab();new MutationObserver(lab).observe(start,{childList:true,characterData:true,subtree:true});
 var gp=d.createElement('div');gp.className='g3-gap';side.appendChild(gp);
 if(quiz){var a=quiz.querySelector('a');if(a){var h=quiz.querySelector('.md-quiz-link-hint');a.innerHTML='<span aria-hidden="true">📝</span><span>線上測驗<span class="g3-sub">'+(h?h.textContent:'另開視窗作答，成績上傳給老師')+'</span></span>';}
  side.appendChild(quiz);}
 d.body.appendChild(g);
 /* 已選摘要 */
 var sm=side.querySelector('.g3-sm'),sc=side.querySelector('.g3-sc');
 function sum(){
  if(sm){var x=modeGrp.querySelector('.selected');sm.textContent=x?x.getAttribute('data-g3'):'尚未選擇';sm.classList.toggle('off',!x);}
  var y=cntGrp.querySelector('.selected');sc.textContent=y?(y.classList.contains('g3-all')?'全部題目':y.textContent+' 題'):'尚未選擇';sc.classList.toggle('off',!y);
 }
 new MutationObserver(sum).observe(g,{subtree:true,attributes:true,attributeFilter:['class']});
 function sync(){d.body.classList.toggle('g3-menu',isMenu());sum();if(typeof fitModes==='function')requestAnimationFrame(fitModes);}
 new MutationObserver(sync).observe(menu,{attributes:true,attributeFilter:['style','class']});
 sync();
})();
</script>
